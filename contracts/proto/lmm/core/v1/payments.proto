syntax = "proto3";
package lmm.core.v1;
option go_package = "github.com/TokenNotIncluded/lmm-api/extensions/internal/corepb;corepb";
import "lmm/core/v1/commands.proto";

// Task 10 handoff, NOT registered. User actions need current user authorization
// plus service permissions. Provider-driven transitions require independently
// verified provider evidence and a core-issued intent/authority, not merely a
// service token. Go cannot assert that a provider event has been verified.
service CorePayments {
  // Owner-installed legacy bases retain original micros and credit units.
  rpc AcceptLegacyProviderProof(AcceptLegacyProviderProofRequest) returns (LegacyProviderProofReceipt);
  rpc GetLegacyProviderProof(GetLegacyProviderProofRequest) returns (LegacyProviderProofReceipt);
  rpc CreditLegacyTopup(CreditLegacyTopupRequest) returns (LegacyPaymentReceipt);
  rpc AcceptProviderProof(AcceptProviderProofRequest) returns (ProviderProofReceipt);
  rpc GetProviderProof(GetProviderProofRequest) returns (ProviderProofReceipt);
  rpc PrepareTopup(PrepareTopupRequest) returns (PaymentIntent);
  // Resolve the personal payer from the current Core session, never a web ID.
  rpc PreparePersonalTopup(PreparePersonalTopupRequest) returns (PaymentIntent);
  // EPay shares one MD5 key between checkout and callback verification. Keep
  // that key in Core; only sign the fixed fields of an existing Core intent.
  rpc GetEPayCheckout(GetEPayCheckoutRequest) returns (EPayCheckout);
  rpc CreditTopup(CreditTopupRequest) returns (PaymentReceipt);
  rpc HoldRefund(HoldRefundRequest) returns (PaymentReceipt);
  rpc BeginRefundDispatch(ResolveRefundRequest) returns (PaymentReceipt);
  rpc CommitRefund(ResolveRefundRequest) returns (PaymentReceipt);
  rpc ReleaseRefund(ResolveRefundRequest) returns (PaymentReceipt);
  rpc ApplyExternalRefund(ExternalRefundRequest) returns (PaymentReceipt);
  rpc GetPaymentReceipt(GetPaymentReceiptRequest) returns (PaymentReceipt);
}
message ExternalPaymentReference {
  string provider = 1;
  string merchant = 2;
  string environment = 3;
  string transaction = 4;
}
message ProviderEvidence {
  ExternalPaymentReference payment = 1;
  // Bounded original bytes and signature from a configured adapter. Core must
  // independently verify signature, merchant, amount, currency, event identity
  // and replay state. No endpoint URL, secret or caller-set 'verified' flag.
  bytes signed_payload = 2;
  bytes signature = 3;
  string provider_event_id = 4;
  // Only Rust can issue this durable ingress receipt. Later settlement uses
  // this reference and the exact original payload, never a caller timestamp.
  string accepted_proof_id = 5;
}
message AcceptProviderProofRequest {
  int64 intent_id = 1;
  ProviderEvidence evidence = 2;
}
message GetProviderProofRequest {
  int64 intent_id = 1;
  string provider_event_id = 2;
  bytes payload_sha256 = 3;
}
// Receiving proof is distinct from applying money. There is deliberately no
// journal or payment-success state here. Raw bytes/signatures stay private.
message ProviderProofReceipt {
  string proof_id = 1;
  int64 intent_id = 2;
  string provider_event_id = 3;
  bytes payload_sha256 = 4;
  ExternalPaymentReference payment = 5;
  int64 accepted_unix_seconds = 6;
}
message PrepareTopupRequest {
  MutationContext mutation = 1;
  int64 account_id = 2; // core_identity.accounts.id; explicit personal/team account.
  int64 payment_channel_id = 3; // Core-owned allowlisted merchant configuration.
  string currency = 4; // ISO code, e.g. USD. Core validates channel and currency.
  int64 amount_minor = 5; // External minor units; zero requests Core credit-quantity pricing.
  int64 requested_credit_units = 6; // Zero preserves the existing amount-based contract.
}
message PreparePersonalTopupRequest {
  MutationContext mutation = 1;
  int64 payment_channel_id = 2;
  string currency = 3;
  int64 amount_minor = 4;
  int64 requested_credit_units = 5;
}
message PaymentIntent {
  int64 intent_id = 1;
  int64 account_id = 2;
  int64 created_by_user_id = 3; // Output only, from authenticated identity.
  string provider = 4;
  string merchant = 5;
  string environment = 6;
  string currency = 7;
  int64 amount_minor = 8;
  int64 credit_units = 9; // Core-frozen conversion/policy, never Go-calculated.
  string credit_unit = 10; // credit_500k_usd.
  string idempotency_key = 11;
  bytes request_sha256 = 12;
  string receipt_id = 13;
}
message GetEPayCheckoutRequest {
  int64 intent_id = 1;
}
message EPayCheckout {
  int64 intent_id = 1;
  string order_id = 2;
  string checkout_url = 3;
  // GET opens checkout_url; POST submits its query fields to its queryless URL.
  string method = 4;
}
message CreditTopupRequest {
  MutationContext mutation = 1;
  int64 intent_id = 2;
  ProviderEvidence evidence = 3;
}
message HoldRefundRequest {
  MutationContext mutation = 1;
  int64 intent_id = 2; // Must locate original credit even if Go lost its response.
  int64 refund_amount_minor = 3;
}
message ResolveRefundRequest {
  MutationContext mutation = 1;
  int64 intent_id = 2;
  string hold_receipt_id = 3;
  // Commit requires verified provider success; release requires verified terminal
  // failure. Missing/unknown evidence MUST NOT release a hold on timeout.
  ProviderEvidence evidence = 4;
}
message ExternalRefundRequest {
  MutationContext mutation = 1;
  int64 intent_id = 2;
  ProviderEvidence evidence = 3;
  // Must handle a pre-credit refund, a lost credit response and an existing
  // refund hold atomically. Persist a fence against later stale credit replay.
}
message GetPaymentReceiptRequest {
  int64 intent_id = 1;
  string idempotency_key = 2; // Resolved inside authenticated scope, not global.
  // Require topup.read or explicitly scoped reconcile authority.
}
enum PaymentReceiptState {
  PAYMENT_RECEIPT_STATE_UNSPECIFIED = 0;
  PAYMENT_RECEIPT_STATE_CREDIT_APPLIED = 1;
  PAYMENT_RECEIPT_STATE_REFUND_HELD = 2;
  PAYMENT_RECEIPT_STATE_REFUND_COMMITTED = 3;
  PAYMENT_RECEIPT_STATE_REFUND_RELEASED = 4;
  PAYMENT_RECEIPT_STATE_EXTERNAL_REFUND_APPLIED = 5;
  PAYMENT_RECEIPT_STATE_REJECTED = 6;
  // Only the core-issued intent was durably saved. No credit/hold/transfer has
  // occurred; clients MUST NOT interpret this as accepted or queued money.
  PAYMENT_RECEIPT_STATE_PREPARED = 7;
}
message PaymentReceipt {
  string receipt_id = 1;
  int64 intent_id = 2;
  string idempotency_key = 3;
  bytes request_sha256 = 4;
  PaymentReceiptState state = 5;
  int64 journal_id = 6; // When posted; cannot infer a credit from this field alone.
  string rejection_code = 7;
  // No accepted/queued success state. Return only durably committed states.
  // Transport/database timeout remains an unknown result; query/repeat same key.
}
message PaymentStateChangedEvent {
  PaymentReceipt receipt = 1;
  int64 account_id = 2;
}

message AcceptLegacyProviderProofRequest {
  int64 payment_channel_id = 1;
  string order_reference = 2;
  bytes signed_payload = 3;
  bytes signature = 4;
}
message GetLegacyProviderProofRequest {
  int64 payment_channel_id = 1;
  string order_reference = 2;
  string provider_event_id = 3;
  bytes payload_sha256 = 4;
}
message LegacyProviderProofReceipt {
  string proof_id = 1;
  string basis_id = 2;
  int64 payment_channel_id = 3;
  string order_reference = 4;
  string provider_event_id = 5;
  string provider_order_id = 6;
  string provider_payment_id = 7;
  bytes payload_sha256 = 8;
  int64 accepted_unix_seconds = 9;
}
message CreditLegacyTopupRequest {
  MutationContext mutation = 1;
  string proof_id = 2;
}
message LegacyPaymentReceipt {
  string operation_id = 1;
  string basis_id = 2;
  string proof_id = 3;
  PaymentReceiptState state = 4; // CREDIT_APPLIED or REJECTED only.
  int64 journal_id = 5;
  string rejection_code = 6;
}

// Separate entitlement contract. No CreditTopup or caller-selected account/price.
service CoreSubscriptionPayments {
  rpc PreparePancakePurchase(PrepareEPayPurchaseRequest) returns (PancakeSubscriptionOrder);
  rpc ConfirmPancakePurchase(EPaySubscriptionOrderRequest) returns (PancakeSubscriptionOrder);
  rpc ReadPancakePurchase(EPaySubscriptionOrderRequest) returns (PancakeSubscriptionOrder);
  rpc ListPancakePurchases(ListPancakePurchasesRequest) returns (PancakeSubscriptionOrders);
  rpc AcceptPancakeSubscriptionEvent(AcceptPancakeSubscriptionEventRequest) returns (PancakeSubscriptionEvent);
  rpc GetPancakeSubscriptionEvent(GetPancakeSubscriptionEventRequest) returns (PancakeSubscriptionEvent);

  rpc PrepareStripePurchase(PrepareEPayPurchaseRequest) returns (StripeSubscriptionOrder);
  rpc ConfirmStripePurchase(EPaySubscriptionOrderRequest) returns (StripeSubscriptionOrder);
  rpc ReadStripePurchase(EPaySubscriptionOrderRequest) returns (StripeSubscriptionOrder);
  // Atomic original proof admission + optional invoice grant. Requires both
  // subscription proof_ingress and grant capability, never Go API-paid status.
  rpc AcceptStripeSubscriptionEvent(AcceptEPaySubscriptionProofRequest) returns (StripeSubscriptionEvent);
  rpc GetStripeSubscriptionEvent(GetEPaySubscriptionProofRequest) returns (StripeSubscriptionEvent);
  rpc PrepareEPayPurchase(PrepareEPayPurchaseRequest) returns (EPaySubscriptionOrder);
  rpc ConfirmEPayPurchase(EPaySubscriptionOrderRequest) returns (EPayCheckout);
  rpc ReadEPayPurchase(EPaySubscriptionOrderRequest) returns (EPaySubscriptionOrder);
  rpc CancelEPayPurchase(EPaySubscriptionOrderRequest) returns (EPaySubscriptionOrder);
  rpc AcceptEPaySubscriptionProof(AcceptEPaySubscriptionProofRequest) returns (EPaySubscriptionProof);
  rpc GetEPaySubscriptionProof(GetEPaySubscriptionProofRequest) returns (EPaySubscriptionProof);
  rpc ApplyEPaySubscriptionGrant(ApplyEPaySubscriptionGrantRequest) returns (EPaySubscriptionGrant);
}
message StripeSubscriptionPrice {
  int64 plan_id = 1;
  int64 plan_revision = 2;
  int64 channel_id = 3;
  string currency = 4;
  string amount_minor = 5;
  string provider_price_id = 6;
  string interval = 7;
  int64 interval_count = 8;
  string success_url = 9;
  string cancel_url = 10;
}
message StripeSubscriptionOrder {
  EPaySubscriptionOrder order = 1;
  StripeSubscriptionPrice price = 2;
  string merchant = 3;
  string environment = 4;
  string provider_subscription_id = 5;
  string provider_customer_id = 6;
  string state = 7;
  int64 state_created = 8;
  int64 current_period_start = 9;
  int64 current_period_end = 10;
  optional int64 latest_grant_id = 11;
}
message StripeSubscriptionEvent {
  string order_id = 1;
  string event_id = 2;
  bytes payload_sha256 = 3;
  string kind = 4;
  string state = 5;
  string invoice_id = 6;
  optional int64 subscription_id = 7;
  int64 period_start = 8;
  int64 period_end = 9;
}
message PrepareEPayPurchaseRequest {
  MutationContext mutation = 1;
  int64 plan_id = 2;
  int64 payment_channel_id = 3;
}
message EPaySubscriptionOrderRequest { string order_id = 1; }
message EPaySubscriptionOrder {
  string order_id = 1;
  int64 account_id = 2;
  int64 plan_id = 3;
  int64 plan_revision = 4;
  int64 payment_channel_id = 5;
  string currency = 6;
  string amount_minor = 7;
  int64 expires_at_unix = 8;
  optional int64 confirmed_at_unix = 9;
  optional int64 canceled_at_unix = 10;
  string proof_id = 11;
  optional int64 subscription_id = 12;
  optional int64 granted_at_unix = 13;
  optional int64 ends_at_unix = 14;
  // Exact frozen Core Plan JSON, credits remain decimal strings.
  bytes plan_json = 15;
  // Read-only reconstruction from the confirmed frozen binding; absent when unavailable.
  EPayCheckout checkout = 16;
}
message AcceptEPaySubscriptionProofRequest {
  string order_id = 1;
  bytes signed_payload = 2;
  bytes signature = 3;
}
message GetEPaySubscriptionProofRequest {
  string order_id = 1;
  string provider_event_id = 2;
  bytes payload_sha256 = 3;
}
message EPaySubscriptionProof {
  string proof_id = 1;
  string order_id = 2;
  string provider_event_id = 3;
  string provider_transaction = 4;
  bytes payload_sha256 = 5;
  int64 accepted_at_unix = 6;
}
message ApplyEPaySubscriptionGrantRequest {
  string order_id = 1;
  string proof_id = 2;
  string operation_key = 3;
}
message EPaySubscriptionGrant {
  string order_id = 1;
  string proof_id = 2;
  string operation_key = 3;
  int64 subscription_id = 4;
  int64 granted_at_unix = 5;
  int64 ends_at_unix = 6;
}

// Pancake is an entitlement contract, independent of wallet CreditTopup.
// Existing messages/field numbers/enums are unchanged. EPaySubscriptionOrder is
// reused only as the established frozen external-order layout.
message PancakeSubscriptionPrice {
 int64 plan_id=1; int64 plan_revision=2; int64 channel_id=3;
 string currency=4; string amount_minor=5; string store_id=6;
 string product_id=7; string product_type=8; string billing_period=9;
 string provider_plan_reference=10; string return_url=11;
 string checkout_region=12; string checkout_language=13; string tax_category=14;
}
message PancakeSubscriptionOrder {
 EPaySubscriptionOrder order=1; PancakeSubscriptionPrice price=2;
 string merchant=3; string environment=4; string provider_reference=5;
 string provider_order_id=6; string state=7; int64 state_created=8;
 int64 paid_period_start=9; int64 paid_period_end=10;
 optional int64 latest_grant_id=11; bytes legacy_source_json=12;
}
message ListPancakePurchasesRequest {}
message PancakeSubscriptionOrders { repeated PancakeSubscriptionOrder orders=1; }
message AcceptPancakeSubscriptionEventRequest {
 int64 payment_channel_id=1; string provider_reference=2;
 bytes signed_payload=3; bytes signature=4;
}
message GetPancakeSubscriptionEventRequest {
 int64 payment_channel_id=1; string provider_reference=2;
 string provider_event_id=3; bytes payload_sha256=4;
}
message PancakeSubscriptionEvent {
 string order_id=1; string event_id=2; bytes payload_sha256=3;
 string kind=4; string state=5; string provider_order_id=6;
 optional string payment_id=7; string cycle_key=8;
 optional int64 subscription_id=9; int64 period_start=10; int64 period_end=11;
}
