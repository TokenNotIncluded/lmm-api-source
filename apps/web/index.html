<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script id="identity-email-bootstrap">
      ;(() => {
        if (!/^\/(?:reset|user\/reset)\/?$/.test(decodeURI(location.pathname)))
          return
        window.__lmmEmailResetPage = true
        const referrer = document.createElement('meta')
        referrer.name = 'referrer'
        referrer.content = 'no-referrer'
        document.head.appendChild(referrer)
        const csp = document.createElement('meta')
        csp.httpEquiv = 'Content-Security-Policy'
        csp.content =
          "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'"
        document.head.appendChild(csp)
        const query = new URLSearchParams(location.search)
        const fragment = new URLSearchParams(location.hash.slice(1))
        window.history.replaceState(window.history.state, '', location.pathname)
        const hasFragment = fragment.has('email') || fragment.has('token')
        if (hasFragment && (query.has('email') || query.has('token'))) return
        const credentials = hasFragment ? fragment : query
        const email = credentials.getAll('email')
        const token = credentials.getAll('token')
        if (
          email.length === 1 &&
          email[0] &&
          token.length === 1 &&
          /^[0-9a-f]{32}$/.test(token[0])
        ) {
          Object.defineProperty(window, '__lmmEmailReset', {
            value: { email: email[0], token: token[0] },
            configurable: true,
          })
        }
      })()
    </script>
    <script src="/extore-callback.js"></script>
    <link rel="icon" type="image/svg+xml" href="/lmm-api-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>LMM API | Language Model Mesh</title>
    <meta name="title" content="LMM API | Language Model Mesh" />
    <meta
      name="description"
      content="AI API access and Remote MCP tools."
    />
    <meta name="generator" content="LMM API" />

    <meta name="theme-color" content="#141413" />
    <script>
      ;(() => {
        const match = document.cookie.match(
          /(?:^|;\s*)vite-ui-theme=(dark|light|system)(?:;|$)/
        )
        const savedTheme = match?.[1]
        const theme =
          savedTheme === 'light' ||
          (savedTheme === 'system' &&
            !window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'light'
            : 'dark'
        document.documentElement.classList.add(theme)
        document
          .querySelector("meta[name='theme-color']")
          ?.setAttribute('content', theme === 'dark' ? '#020817' : '#fff')
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body
    data-theme-preset="default"
    data-theme-font="sans"
    data-theme-content-layout="full"
  >
    <script id="theme-customization-bootstrap">
      ;(() => {
        const read = (name) =>
          document.cookie.match(
            new RegExp('(?:^|;\\s*)' + name + '=([^;]*)(?:;|$)')
          )?.[1]
        const stored = read('theme_preset')
        const presets = [
          'ant',
          'default',
          'simple-large',
          'underground',
          'rose-garden',
          'lake-view',
          'sunset-glow',
          'forest-whisper',
          'ocean-breeze',
          'lavender-dream',
        ]
        const preset =
          stored === 'anthropic'
            ? 'ant'
            : presets.includes(stored)
              ? stored
              : 'default'
        const body = document.body
        body.dataset.themePreset = preset
        const font = read('theme_font')
        body.dataset.themeFont =
          font === 'sans' || font === 'serif'
            ? font
            : preset === 'ant'
              ? 'serif'
              : 'sans'
        for (const [axis, allowed] of [
          ['radius', ['none', 'sm', 'md', 'lg', 'xl']],
          ['scale', ['sm', 'lg', 'xl']],
        ]) {
          const value = read('theme_' + axis)
          if (allowed.includes(value))
            body.setAttribute('data-theme-' + axis, value)
        }
        body.dataset.themeContentLayout =
          read('theme_content_layout') === 'centered' ? 'centered' : 'full'
      })()
    </script>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
