# Non-secret runtime configuration; install as /etc/lmm.conf.d/extensions.toml.
# Provision an independently generated private host token (service-owned 0600).
version = 1

[host]
listen = "127.0.0.1:8081"
token_file = "/etc/lmm.conf.d/secrets/extensions/host-token"
# Optional 0600 lifecycle state. Enable only after provisioning the writable
# extensions state directory; the file stores plugin names and enablement, no
# credentials or executable bytes.
# plugin_state_file = "/var/lib/lmm/extensions/plugins.json"
modules = ["none"]
web_compat = false
# Shared HTTP, compatibility, callback and recovery-worker admission.
# Omit for 16; valid range 1..64. Tune using measured deployment capacity.
# Remote-control SSE retains at least one slot for non-stream work.
# At 1, SSE returns 429 relay_capacity; commands and heartbeats remain usable.
max_in_flight = 16

# Enable a module only after provisioning its narrow credentials and storage.
# No core database credential belongs in this file or this service.
# [core]
# socket = "/run/lmm/core/core.sock"
# identity_token_file = "/etc/lmm.conf.d/secrets/extensions/core-rpc-token"
# The community read-purpose token enables rankings and acquisition analytics.
# Select "community", "acquisition", or both; it is not the identity RPC token.
# The read service speaks HTTP on its own private socket, not gRPC core.socket.
# user_read_socket = "/run/lmm/core/community.sock"
# user_read_token_file = "/etc/lmm.conf.d/secrets/extensions/community-read-token"
# commerce_token_file = "/etc/lmm.conf.d/secrets/extensions/commerce-rpc-token"
# payment_token_file = "/etc/lmm.conf.d/secrets/extensions/payment-rpc-token"
# To enable wallet checkout, explicitly select "payments" in host.modules,
# enable host.web_compat, and install the separate payments database first.
# [payments]
# database_name = "lmm_payments"
# database_url_file = "/etc/lmm.conf.d/secrets/extensions/payment-database-url"
# config_file = "/etc/lmm.conf.d/extensions-payments.toml"
# callbacks_enabled = true
# [store]
# database_name = "lmm_store"
# database_url_file = "/etc/lmm.conf.d/secrets/extensions/store-database-url"
# Optional private raw 32-byte seal key for per-unit stock contents. Omit to
# keep stock import disabled; never reuse Core or host credential bytes.
# stock_key_file = "/etc/lmm.conf.d/secrets/extensions/store-stock-key"
# [support]
# database_name = "lmm_support"
# database_url_file = "/etc/lmm.conf.d/secrets/extensions/support-database-url"
# [legal]
# config_file = "/etc/lmm.conf.d/legal.toml"

# Community and acquisition HTTP routes also require host.web_compat = true.
# [community]
# database_name = "lmm_community"
# database_url_file = "/etc/lmm.conf.d/secrets/extensions/community-database-url"
# [acquisition]
# database_name = "lmm_acquisition"
# database_url_file = "/etc/lmm.conf.d/secrets/extensions/acquisition-database-url"
