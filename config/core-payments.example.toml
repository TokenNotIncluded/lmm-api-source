# Version 2 payment verification and conversion policy, owned by Core.
# See docs/payment-gateways.md. These are eight independent example channels,
# not enabled installation defaults. Replace IDs, paths and policy deliberately.
# USD uses the existing 500000-credit/USD unit. Non-USD conversion below is
# illustrative administrator policy, NOT an exchange rate or recommended price.
version = 2

[permissions]
prepare = true
credit_evidence = true
read_user = true
reconcile = true
proof_ingress = true
proof_read = true
refund_user = false
refund_evidence = false

[[channels]]
id = 1
provider = "stripe"
merchant = "acct_REPLACE"
environment = "test"
currency = "USD"
credits_per_minor = 5000
max_amount_minor = 100000
webhook_secret_file = "/etc/lmm.conf.d/secrets/core/stripe-webhook-secret"

[[channels]]
id = 2
provider = "epay"
merchant = "10001"
environment = "live"
currency = "CNY"
credits_per_minor = 1000
max_amount_minor = 100000
webhook_secret_file = "/etc/lmm.conf.d/secrets/core/epay-merchant-key"
payment_type = "alipay"
endpoint = "https://pay.example.invalid"
notify_url = "https://api.example.invalid/callbacks/2"
return_url = "https://api.example.invalid/console/wallet"

[[channels]]
id = 3
provider = "epay"
merchant = "10001"
environment = "live"
currency = "CNY"
credits_per_minor = 1000
