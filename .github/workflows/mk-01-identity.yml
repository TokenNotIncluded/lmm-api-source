name: MK-01 identity and teams
on:
  push:
    branches: [main]
    paths:
      - services/core/**
      - .github/workflows/mk-01-identity.yml
  pull_request:
    branches: [main]
    paths:
      - services/core/**
      - .github/workflows/mk-01-identity.yml
permissions:
  contents: read
concurrency:
  group: mk-01-verified-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  identity:
    # All merged modules use the same preserved executors and private fixtures.
    uses: ./.github/workflows/core-protocol.yml
    with:
      split_rust_targets: true
