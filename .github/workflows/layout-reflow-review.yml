name: Layout reflow review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/src/components/layout/**"
      - "apps/web/src/components/data-table/**"
      - "apps/web/src/components/ui/input.tsx"
      - "apps/web/src/features/auth/**"
      - "apps/web/src/features/developers/**"
      - "apps/web/src/features/wallet/**"
      - "apps/web/src/styles/**"
      - "apps/web/scripts/layout-reflow-review.mjs"
      - ".github/workflows/layout-reflow-review.yml"
  pull_request:
    paths:
      - "apps/web/src/components/layout/**"
      - "apps/web/src/components/data-table/**"
      - "apps/web/src/components/ui/input.tsx"
      - "apps/web/src/features/auth/**"
      - "apps/web/src/features/developers/**"
      - "apps/web/src/features/wallet/**"
      - "apps/web/src/styles/**"
      - "apps/web/scripts/layout-reflow-review.mjs"
      - ".github/workflows/layout-reflow-review.yml"

permissions:
  contents: read

concurrency:
  group: layout-reflow-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Record reviewed revision
        env:
          LAYOUT_REVIEW_OUTPUT: ${{ runner.temp }}/layout-reflow
        run: |
          mkdir -p "$LAYOUT_REVIEW_OUTPUT"
          git rev-parse HEAD > "$LAYOUT_REVIEW_OUTPUT/revision.txt"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install locked application dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/layout-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/layout-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Build public pages and review isolated local fixtures
        working-directory: apps/web
        shell: bash
        env:
          LAYOUT_REVIEW_OUTPUT: ${{ runner.temp }}/layout-reflow
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/layout-browser/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          bun run build > "$LAYOUT_REVIEW_OUTPUT/build.log" 2>&1
          bun run bundle:check > "$LAYOUT_REVIEW_OUTPUT/bundle-check.log" 2>&1
          LMM_ENABLE_PERSONA_DEBUG=1 bun run dev --port 4174 > "$LAYOUT_REVIEW_OUTPUT/console-server.log" 2>&1 &
          console_pid=$!
          bun run preview --port 4175 > "$LAYOUT_REVIEW_OUTPUT/public-server.log" 2>&1 &
          public_pid=$!
          trap 'kill "$console_pid" "$public_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null && curl --fail --silent http://127.0.0.1:4175/ > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          node scripts/layout-reflow-review.mjs 2>&1 | tee "$LAYOUT_REVIEW_OUTPUT/review.log"
      - name: Upload screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layout-reflow-review
          path: ${{ runner.temp }}/layout-reflow
          retention-days: 7
          if-no-files-found: error
