name: Main quick checks
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the pushed changes
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            BEFORE="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$BEFORE" "$GITHUB_SHA"
          if ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
            ':(glob)services/core/**/*.rs' services/core/Cargo.toml services/core/rust-toolchain.toml \
            ':(glob)**/rustfmt.toml' ':(glob)**/.rustfmt.toml' .github/workflows/main-checks.yml; then
            echo 'core_format=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Exercise the workflow and scheduling contracts
        run: |
          node --test scripts/workflow-topology.test.mjs
          python3 -B -m unittest discover -s scripts/ci -p 'test_core_cadence.py'
      - name: Show the pinned Core formatting diff
        if: ${{ !cancelled() && steps.changed.outputs.core_format == 'true' }}
        working-directory: services/core
        run: |
          cargo fmt --all
          git diff --no-ext-diff --no-color --exit-code -- .
