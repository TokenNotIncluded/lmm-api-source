name: Build and deploy configured environment

on:
  workflow_dispatch:
    inputs:
      components:
        description: Components to update (all or comma-separated core,extensions,web)
        default: all
        type: string
      targets:
        description: Target names from DEPLOY_TARGETS (all or comma-separated names)
        default: all
        type: string
      source_revision:
        description: Optional full commit SHA from main history (manual dispatch on main only)
        type: string
      version:
        description: Optional archive version; otherwise derived from the run
        type: string
  push:
    tags: ['v*', 'shadow-v*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ vars.DEPLOY_ENVIRONMENT || 'shadow' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
  SELECT_COMPONENTS: ${{ inputs.components || 'all' }}
  SELECT_TARGETS: ${{ inputs.targets || 'all' }}

jobs:
  plan:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a source revision from main
        id: source
        env:
          REQUESTED_REVISION: ${{ inputs.source_revision }}
          CI_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          revision=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            if [[ ! "$CI_REVISION" =~ ^[0-9a-f]{40}$ || "$CI_REVISION" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
              echo "Automatic deployment requires CI for the current main commit." >&2
              exit 1
            fi
            revision=$CI_REVISION
          elif [[ -n "$REQUESTED_REVISION" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ]]; then
              echo "Selecting a source revision requires manual dispatch on main." >&2
              exit 1
            fi
            if [[ ! "$REQUESTED_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "The source revision must be a full 40-character commit SHA." >&2
              exit 1
            fi
            revision=${REQUESTED_REVISION,,}
            if [[ "$(git rev-parse --verify "$revision^{commit}")" != "$revision" ]]; then
              echo "The requested SHA must identify a commit object." >&2
              exit 1
            fi
          fi
          git merge-base --is-ancestor "$revision" origin/main
          git checkout --detach "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Select targets and build each component architecture once
        id: plan
        env:
          DEPLOY_VERSION: ${{ inputs.version }}
        run: python3 scripts/deployment-plan.py plan
      - name: Check deployment planning and workflow contracts
        run: |
          python3 -B scripts/test-deployment-plan.py
          node --test scripts/workflow-topology.test.mjs

  ci-gate:
    needs: plan
    outputs:
      run-id: ${{ steps.admission.outputs.run-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.plan.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use CI admission policy from the dispatching main commit
        if: inputs.source_revision != ''
        run: git restore --source="$GITHUB_SHA" -- scripts/verify-deployment-ci.py scripts/test-verify-deployment-ci.py
      - name: Check deployment CI admission
        run: python3 -B scripts/test-verify-deployment-ci.py
      - name: Require successful CI for this source revision
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ needs.plan.outputs.revision }}
        run: |
          receipt=$(python3 -B scripts/verify-deployment-ci.py --revision "$SOURCE_REVISION")
          run_id=$(jq -er '.run_id | select(type == "number" and . > 0)' <<<"$receipt")
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

  build:
    needs: [plan, ci-gate]
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      COMPONENT: ${{ matrix.component }}
      ARCH: ${{ matrix.arch }}
      SOURCE_REVISION: ${{ needs.plan.outputs.revision }}
      PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.plan.outputs.revision }}
          persist-credentials: false
      - name: Initialize the pinned Extore plugin dependency
        if: matrix.component == 'extensions'
        run: |
          git submodule update --init --depth 1 -- packages/extore
          python3 -B scripts/check-extore-plugin-pin.py
      - name: Record the artifact source date
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Check Core formatting
        if: matrix.component == 'core'
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt
          cargo +1.100.0 fmt --manifest-path services/core/Cargo.toml --all --check
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        if: matrix.component == 'extensions'
        with:
          go-version: '1.27.2'
          cache-dependency-path: services/extensions/go.sum
      - name: Check the extension host and policy
        if: matrix.component == 'extensions'
        working-directory: services/extensions
        run: |
          bash ../../scripts/check-go-format.sh .
          go test -mod=readonly ./internal/app ./internal/legal
      - name: Build the selected backend on the runner
        if: matrix.component != 'web'
        run: |
          docker buildx build --file "deployment/docker/${COMPONENT}.Dockerfile" \
            --target binaries --output "type=local,dest=out/${COMPONENT}" .
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: matrix.component == 'web'
        with:
          bun-version: '1.3.14'
      - name: Install locked Web dependencies
        if: matrix.component == 'web'
        run: bun install --frozen-lockfile
      - name: Check Web types and authentication regressions
        if: matrix.component == 'web'
        run: |
          bun run typecheck:web
          cd apps/web
          bun x --no-install oxlint -c .oxlintrc.json src/components/auth-cookie-recovery.tsx src/lib/auth-cookie-reconciliation.ts
          for test_file in \
            src/components/auth-cookie-recovery-local.test.tsx \
            src/features/errors/auth-cookie-recovery.test.tsx \
            src/lib/auth-cookie.test.ts; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "./$test_file"
          done
      - name: Check recovery in a real browser
        if: matrix.component == 'web'
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts --no-save --package-lock=false playwright@1.65.1
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs" \
            node apps/web/scripts/auth-cookie-reconciliation-browser.mjs
      - name: Download Web assets verified by the admitted CI run
        if: matrix.component == 'web'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-${{ needs.plan.outputs.revision }}-${{ needs.ci-gate.outputs.run-id }}
          run-id: ${{ needs.ci-gate.outputs.run-id }}
          github-token: ${{ github.token }}
          path: out/web
      - name: Package and verify the exact component
        run: |
          platform="linux-$ARCH"
          if [[ "$COMPONENT" == web ]]; then platform=any; fi
          python3 scripts/build-distribution.py build --component "$COMPONENT" \
            --version "$PACKAGE_VERSION" --revision "$SOURCE_REVISION" \
            --platform "$platform" --input "out/$COMPONENT"
          for archive in out/distributions/*.tar.gz; do
            python3 scripts/build-distribution.py verify "$archive" --revision "$SOURCE_REVISION"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-${{ matrix.component }}-${{ matrix.arch }}-${{ needs.plan.outputs.revision }}
          path: out/distributions/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [plan, ci-gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'shadow' }}
    env:
      DEPLOY_REVISION: ${{ needs.plan.outputs.revision }}
      ANSIBLE_HOST_KEY_CHECKING: 'True'
      ANSIBLE_RETRY_FILES_ENABLED: 'False'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.plan.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: deploy-*-${{ needs.plan.outputs.revision }}
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the pinned deployment tool
        run: pip install 'ansible-core==2.22.0'
      - name: Exercise deployment and rollback in a disposable HTTP fixture
        run: python3 -B scripts/test-deployment-rollback.py
      - name: Verify artifacts and prepare the inventory
        run: python3 scripts/deployment-plan.py inventory --artifacts artifacts --output "$RUNNER_TEMP/inventory.json"
      - name: Recheck automatic deployment against current main
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$DEPLOY_REVISION" != "$current" ]]; then
            echo "Main advanced while the candidate was building." >&2
            exit 1
          fi
      - name: Configure ephemeral SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy-ssh"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          echo "ANSIBLE_PRIVATE_KEY_FILE=$RUNNER_TEMP/deploy-ssh/key" >> "$GITHUB_ENV"
          echo "ANSIBLE_SSH_COMMON_ARGS=-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Deploy serially and check the running components
        run: ansible-playbook -i "$RUNNER_TEMP/inventory.json" deployment/automation/deploy.yml
      - name: Delete runner credentials and downloaded archives
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/deploy-ssh" "$RUNNER_TEMP/inventory.json" artifacts
