name: Microkernel implementation checks
on:
  workflow_dispatch:
  workflow_call:
# ci.yml owns automatic push/PR runs so this expensive suite runs only once.
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: microkernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: ubuntu-24.04
    # Budget for cold builds, serial real PostgreSQL tests, and the following
    # payment, Go, and RPC checks while keeping the complete job bounded.
    timeout-minutes: 150
    env:
      GOWORK: "off"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Upgrade preservation tests snapshot cluster-wide roles and memberships.
      # Concurrent fixtures must not create/drop roles inside another snapshot.
      RUST_TEST_THREADS: "1"
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Initialize the pinned CLI only for archive contract checks
        run: git submodule update --init --depth 1 -- apps/cli
      - name: Record exact integration source
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/core-source-sha.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/core-source.tar.gz" HEAD \
            services/core services/extensions contracts deployment/docker deployment/postgres scripts tests/commerce \
            .github/workflows config/legal packaging docs/core-migration.md
          sha256sum "$RUNNER_TEMP/core-source.tar.gz" > "$RUNNER_TEMP/core-source.sha256"
      - name: Preserve source before checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: microkernel-source-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-source.tar.gz
            ${{ runner.temp }}/core-source-sha.txt
            ${{ runner.temp }}/core-source.sha256
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version: '1.27.2'
          cache-dependency-path: services/extensions/go.sum
      - name: Install pinned Rust, protobuf compiler, and PostgreSQL 18 tools
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          sudo --preserve-env=GITHUB_ACTIONS python3 scripts/prepare-ci-apt.py
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes protobuf-compiler curl ca-certificates
          # Private financial fixtures need host PG18 tools, independent of the service container.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' \
            'Suites: noble-pgdg' "Architectures: $(dpkg --print-architecture)" 'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes postgresql-common
          # Each test creates its own cluster; package installation must not create a shared one.
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf > /dev/null
          sudo apt-get install --no-install-recommends --yes postgresql-18 postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Workflow and source boundaries
        run: |
          node --test scripts/workflow-topology.test.mjs
          python3 -B scripts/test-verify-deployment-ci.py
          python3 -B scripts/test-core-boundaries.py
          python3 -B scripts/test-local-release-tests.py
          python3 -B scripts/check-docs-brand.py
          python3 -B scripts/test_docs_brand.py
          python3 -B scripts/test-distribution.py
          python3 -B scripts/test-docs-microservices.py
      - name: Check generated Go bindings
        run: bash scripts/generate-core-protocol.sh --check
      - name: Build actual Go host for Rust stream isolation
        if: ${{ !cancelled() }}
        working-directory: services/extensions
        run: |
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o "$RUNNER_TEMP/lmm-extensions" ./cmd/extensions
          echo "LMM_RELAY_EXTENSION_BIN=$RUNNER_TEMP/lmm-extensions" >> "$GITHUB_ENV"
      - name: Public legal reads with the actual Go host
        run: LMM_EXTENSION_TEST_BIN="$RUNNER_TEMP/lmm-extensions" python3 -B scripts/test-legal-process.py
      - name: File-only Compose and private RPC fixture contracts
        run: |
          python3 -B scripts/test_core_rpc_fixture.py -v
          python3 -B tests/payments/test_verify_live_discovery.py -v
      - name: Rust formatting
        working-directory: services/core
        run: cargo fmt --all --check 2>&1 | tee "$RUNNER_TEMP/core-format.log"
      - name: Build the preserved migration executors
        if: ${{ !cancelled() }}
        run: |
          git fetch --no-tags --depth=1 origin 0510c2455dabcb63e33c719ba52ac189d62612bc 2a0c7bd380f58a553dc903d399255821c1a65d0f 8f1b6b837ace7027f2a62f15168843790ce6de28
          rustup toolchain install 1.99.0 --profile minimal
          rustup run 1.99.0 python3 scripts/build-preserved-core.py --family pancake67 --output "$RUNNER_TEMP/preserved-pancake67"
          rustup run 1.99.0 python3 scripts/build-preserved-core.py --family early58 --output "$RUNNER_TEMP/preserved-early58"
          cat "$RUNNER_TEMP/preserved-pancake67/executor.env" "$RUNNER_TEMP/preserved-early58/executor.env" >> "$GITHUB_ENV"
      - name: Prepare private acquisition PostgreSQL fixtures
        if: ${{ !cancelled() }}
        run: python3 -B scripts/prepare-acquisition-ci.py
      - name: Compile Rust tests and preserve the commerce driver
        id: rust_test_compile
        if: ${{ !cancelled() }}
        working-directory: services/core
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets --no-run --message-format=json > "$RUNNER_TEMP/core-test-artifacts.jsonl"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          messages = [json.loads(line) for line in (temp / "core-test-artifacts.jsonl").read_text().splitlines()]
          matches = [item for item in messages if item.get("reason") == "compiler-artifact"
                     and item.get("target", {}).get("name") == "commerce_process"
                     and item["target"].get("kind") == ["test"] and item.get("executable")]
          assert len(matches) == 1, "expected exactly one compiled commerce_process executable"
          artifact = matches[0]
          binary = pathlib.Path(artifact["executable"]).resolve(strict=True)
          assert binary.is_file() and os.access(binary, os.X_OK)
          assert pathlib.Path(artifact["target"]["src_path"]).resolve() == root / "services/core/tests/commerce_process.rs"
          git = lambda *args: subprocess.check_output(["git", "-C", str(root), *args], text=True).strip()
          revision = git("rev-parse", "HEAD")
          assert revision == os.environ["GITHUB_SHA"]
          assert not git("status", "--porcelain"), "compiled source checkout is not clean"
          out = temp / "commerce-acceptance-driver"
          out.mkdir(mode=0o700)
          shutil.copy2(binary, out / "commerce_process")
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          paths = subprocess.check_output(["git", "-C", str(root), "ls-files", "-z", "--",
              "services/core", "tests/commerce", "deployment/postgres", "contracts/proto",
              "services/extensions/internal/modules/store/schema.sql"]).decode().split("\0")
          inputs = {name: sha(root / name) for name in paths if name and (root / name).is_file()}
          (out / "source-inputs.json").write_text(json.dumps(inputs, sort_keys=True, indent=2) + "\n")
          (out / "compiler-artifact.json").write_text(json.dumps(artifact, sort_keys=True, indent=2) + "\n")
          receipt = {"format": "lmm-commerce-ci-driver-v1", "revision": revision,
              "source_tree": git("rev-parse", "HEAD^{tree}"), "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "rustc_verbose": subprocess.check_output(["rustc", "-Vv"], text=True),
              "build_working_directory": str(pathlib.Path.cwd()), "cargo_profile": artifact["profile"],
              "compiler_executable": str(binary), "binary": "commerce_process",
              "binary_sha256": sha(out / "commerce_process"),
              "source_inputs_sha256": sha(out / "source-inputs.json"),
              "compiler_artifact_sha256": sha(out / "compiler-artifact.json"),
              "qualification": "Compilation only; CI result and independent runtime acceptance remain separate"}
          (out / "receipt.json").write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          PY
      - name: Preserve compiled commerce acceptance driver
        if: ${{ !cancelled() && steps.rust_test_compile.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: commerce-acceptance-driver-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/commerce-acceptance-driver
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Rust checks and real database tests
        if: ${{ !cancelled() && steps.rust_test_compile.outcome == 'success' }}
        working-directory: services/core
        run: |
          LMM_MODEL_PROCESS_CORE_BIN="$(realpath target/debug/lmm-core)"
          LMM_MODEL_PROCESS_CORE_SHA256="$(sha256sum "$LMM_MODEL_PROCESS_CORE_BIN" | cut -d ' ' -f1)"
          process_evidence_root="$(mktemp -d "$RUNNER_TEMP/core-process-evidence-XXXXXXXX")"
          LMM_MODEL_PROCESS_ROOT="$(mktemp -d "$process_evidence_root/model-XXXXXXXX")"
          export LMM_MODEL_PROCESS_CORE_BIN LMM_MODEL_PROCESS_CORE_SHA256 LMM_MODEL_PROCESS_ROOT
          # Independent TCP/process cases require new private evidence roots.
          # Their child-worker config is created by each owning test.
          LMM_CONTINUITY_DEV_ARTIFACTS="$(mktemp -d "$process_evidence_root/continuity-dev-XXXXXXXX")"
          COMPACT_INDEPENDENT_ARTIFACTS="$(mktemp -d "$process_evidence_root/compact-XXXXXXXX")"
          RESPONSES_CONTINUITY_INDEPENDENT_ARTIFACTS="$(mktemp -d "$process_evidence_root/continuity-independent-XXXXXXXX")"
          RESPONSES_CONTINUITY_REVIEW_ARTIFACTS="$(mktemp -d "$process_evidence_root/continuity-review-XXXXXXXX")"
          LMM_WS_ARTIFACTS="$(mktemp -d "$process_evidence_root/websocket-XXXXXXXX")"
          LMM_WS_CORE_BINARY="$LMM_MODEL_PROCESS_CORE_BIN"
          export LMM_CONTINUITY_DEV_ARTIFACTS COMPACT_INDEPENDENT_ARTIFACTS
          export RESPONSES_CONTINUITY_INDEPENDENT_ARTIFACTS RESPONSES_CONTINUITY_REVIEW_ARTIFACTS
          export LMM_WS_ARTIFACTS LMM_WS_CORE_BINARY
          # The non-ignored payment recovery case requires sealed Core, Go host
          # and bootstrap binaries. The 302-second case stays ignored.
          CGO_ENABLED=0 go test -C ../extensions -mod=readonly -c -o "$RUNNER_TEMP/lmm-payment-bootstrap" ./internal/modules/payments
          LMM_PAYMENT_CORE_BIN="$LMM_MODEL_PROCESS_CORE_BIN"
          LMM_PAYMENT_CORE_SHA256="$LMM_MODEL_PROCESS_CORE_SHA256"
          LMM_PAYMENT_GO_BIN="$(realpath "$LMM_RELAY_EXTENSION_BIN")"
          LMM_PAYMENT_GO_SHA256="$(sha256sum "$LMM_PAYMENT_GO_BIN" | cut -d ' ' -f1)"
          LMM_PAYMENT_BOOTSTRAP_BIN="$(realpath "$RUNNER_TEMP/lmm-payment-bootstrap")"
          LMM_PAYMENT_BOOTSTRAP_SHA256="$(sha256sum "$LMM_PAYMENT_BOOTSTRAP_BIN" | cut -d ' ' -f1)"
          export LMM_PAYMENT_CORE_BIN LMM_PAYMENT_CORE_SHA256 LMM_PAYMENT_GO_BIN LMM_PAYMENT_GO_SHA256 LMM_PAYMENT_BOOTSTRAP_BIN LMM_PAYMENT_BOOTSTRAP_SHA256
          # Emit panic diagnostics immediately, including when the job times out.
          cargo test --locked --all-targets --no-fail-fast -- --skip synthetic_live_proof_crosses_core_go_processes_and_posts_once --nocapture 2>&1 | tee "$RUNNER_TEMP/core-tests.log"
      - name: Synthetic payment live process through owning runner
        if: ${{ !cancelled() }}
        run: python3 -B scripts/ci-payment-live.py --output "$(realpath -m "$RUNNER_TEMP/payment-live")" 2>&1 | tee "$RUNNER_TEMP/payment-live-build.log"
      - name: Go contract and race tests
        if: ${{ !cancelled() }}
        working-directory: services/extensions
        run: |
          bash ../../scripts/check-go-format.sh .
          go mod verify
          go vet ./...
          go test -race ./... -count=1 -json | tee "$RUNNER_TEMP/extension-tests.jsonl"
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o "$RUNNER_TEMP/lmm-extensions" ./cmd/extensions
      - name: Store and support real PostgreSQL acceptance
        if: ${{ !cancelled() }}
        env:
          LMM_STORE_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/lmm_store_test?sslmode=disable
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lmm_store_test'
          trap 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS lmm_store_test"' EXIT
          cd services/extensions/internal/modules/store/pgtest
          go mod verify
          go vet -mod=readonly ./...
          go test -mod=readonly -race -count=1 -json ./... | tee "$RUNNER_TEMP/store-postgres.jsonl"
      - name: Durable cross-language event process recovery
        if: ${{ !cancelled() }}
        run: |
          (cd services/core && cargo build --locked --example protocol-events-fixture)
          (cd contracts/proto/tests/go && go vet -mod=readonly ./... && go build -mod=readonly -o "$RUNNER_TEMP/mk06-go-fixture" .)
          MK06_GO_FIXTURE="$RUNNER_TEMP/mk06-go-fixture" python3 contracts/proto/tests/process_recovery.py 2>&1 | tee "$RUNNER_TEMP/events-process.log"
      - name: Native protobuf round trips and failure recovery
        if: ${{ !cancelled() }}
        run: |
          # Absolute, symlink-free, and absent: the fixture creates a private empty 0700 root.
          evidence="$(realpath -m -- "$RUNNER_TEMP/core-rpc-docker-evidence")"
          if [[ -e "$evidence" || -L "$evidence" ]]; then
            echo "RPC evidence root must be absent before the fixture creates it" >&2
            exit 1
          fi
          python3 -B scripts/test-core-rpc-docker.py --output-root "$evidence" --build-timeout-seconds 2400 2>&1 | tee "$RUNNER_TEMP/core-rpc-docker.log"
      - name: Stage readable core RPC evidence
        if: ${{ always() }}
        run: |
          # Secret files are chowned to container uid 65532 and mode 0400.
          # upload-artifact fails the whole zip if any selected file is unreadable.
          src="$RUNNER_TEMP/core-rpc-docker-evidence"
          dest="$RUNNER_TEMP/core-rpc-docker-evidence-readable"
          rm -rf -- "$dest"
          if [[ ! -d "$src" ]]; then
            echo "No core RPC evidence directory to stage"
            exit 0
          fi
          mkdir -- "$dest"
          chmod 0700 -- "$dest"
          while IFS= read -r -d '' dir; do
            rel="${dir#"$src"/}"
            mkdir -p -- "$dest/$rel"
            chmod 0700 -- "$dest/$rel"
          done < <(find "$src" -mindepth 1 -type d -print0)
          while IFS= read -r -d '' file; do
            rel="${file#"$src"/}"
            parent="$dest/$(dirname -- "$rel")"
            mkdir -p -- "$parent"
            chmod 0700 -- "$parent"
            cp -p -- "$file" "$dest/$rel"
          done < <(find "$src" -type f -readable -print0)
      - name: Service boundary contracts
        if: ${{ !cancelled() }}
        run: python3 -B scripts/test-core-boundaries.py
      - name: Preserve implementation test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: microkernel-checks-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-source-sha.txt
            ${{ runner.temp }}/core-format.log
            ${{ runner.temp }}/preserved-pancake67/provenance.json
            ${{ runner.temp }}/preserved-pancake67/source.tar.gz
            ${{ runner.temp }}/preserved-pancake67/schema-manifest.json
            ${{ runner.temp }}/preserved-pancake67/build.log
            ${{ runner.temp }}/preserved-early58/provenance.json
            ${{ runner.temp }}/preserved-early58/source.tar.gz
            ${{ runner.temp }}/preserved-early58/schema-manifest.json
            ${{ runner.temp }}/preserved-early58/build.log
            ${{ runner.temp }}/core-tests.log
            ${{ runner.temp }}/core-process-evidence-*
            ${{ runner.temp }}/payment-live-build.log
            ${{ runner.temp }}/payment-live/evidence/result.json
            ${{ runner.temp }}/extension-tests.jsonl
            ${{ runner.temp }}/core-rpc-docker.log
            ${{ runner.temp }}/core-rpc-docker-evidence-readable
            ${{ runner.temp }}/store-postgres.jsonl
            ${{ runner.temp }}/events-process.log
          if-no-files-found: warn
          retention-days: 7

  market-postgres:
    name: Store and tool-market real PostgreSQL checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - name: Checkout the same immutable integration source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record source and require PostgreSQL 18.6
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/market-postgres-inputs"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD > "$RUNNER_TEMP/market-postgres-inputs/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/market-postgres-inputs/source-tree.txt"
          cp .github/workflows/core-protocol.yml "$RUNNER_TEMP/market-postgres-inputs/workflow.yml"
          cp scripts/verify-market-postgres.py "$RUNNER_TEMP/market-postgres-inputs/runner.py"
          docker exec "$POSTGRES_CONTAINER" psql -X -U postgres -Atqc 'SHOW server_version_num' \
            > "$RUNNER_TEMP/market-postgres-inputs/postgres-version.txt"
          test "$(cat "$RUNNER_TEMP/market-postgres-inputs/postgres-version.txt")" = 180006
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version: '1.27.2'
          cache-dependency-path: services/extensions/go.sum
      - name: Require the three original PostgreSQL parent cases without skips
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python3 -B scripts/verify-market-postgres.py \
            --source "$GITHUB_WORKSPACE" --product-sha "$GITHUB_SHA" \
            --postgres-container "$POSTGRES_CONTAINER" \
            --output "$RUNNER_TEMP/market-postgres-evidence" \
            --private-dir "$RUNNER_TEMP/market-postgres-private"
      - name: Preserve source, raw test results and non-secret PostgreSQL evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: market-postgres-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/market-postgres-inputs
            ${{ runner.temp }}/market-postgres-evidence
          if-no-files-found: error
          retention-days: 7
