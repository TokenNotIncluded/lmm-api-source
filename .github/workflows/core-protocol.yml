            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes postgresql-common
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf > /dev/null
          sudo apt-get install --no-install-recommends --yes postgresql-18 postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
          echo "LMM_CURRENT_IDENTITY_ROOT=$HOME/.local/state/lmm-api/current-id" >> "$GITHUB_ENV"
      - name: Acquire and verify only the exact official Core archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B control/scripts/check-current-runtime-keys.py acquire --source "$GITHUB_WORKSPACE/product" --output "$LMM_CURRENT_IDENTITY_ROOT" --regression identity
      - name: Run pure checks and real isolated PostgreSQL identity completion
        run: python3 -B control/scripts/check-current-runtime-keys.py run --source "$GITHUB_WORKSPACE/product" --output "$LMM_CURRENT_IDENTITY_ROOT" --regression identity
      - name: Preserve bounded synthetic regression diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-identity-acceptance-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ env.LMM_CURRENT_IDENTITY_ROOT }}/result.public.json
            ${{ env.LMM_CURRENT_IDENTITY_ROOT }}/acquisition.json
            ${{ env.LMM_CURRENT_IDENTITY_ROOT }}/fixture/*.log
            ${{ env.LMM_CURRENT_IDENTITY_ROOT }}/fixture/*.command.json
            ${{ env.LMM_CURRENT_IDENTITY_ROOT }}/fixture/regression/*.stderr.private.txt
            ${{ env.LMM_CURRENT_IDENTITY_ROOT }}/fixture/regression/*.stdout.private.txt
            ${{ env.LMM_CURRENT_IDENTITY_ROOT }}/fixture/regression/result.public.json
          if-no-files-found: warn
          retention-days: 3
          include-hidden-files: true
