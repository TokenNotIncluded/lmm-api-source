name: Plugin compatibility
on:
  workflow_dispatch:
    inputs:
      cc_switch_desktop_only:
        description: Run just the LMM adapter and official Linux CC Switch desktop
        type: boolean
        default: false
      google_sdk_only:
        description: Run just the Google Gen AI SDK and public HTTP protocol matrix
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: plugin-compatibility-${{ github.ref }}${{ inputs.cc_switch_desktop_only && '-cc-switch' || inputs.google_sdk_only && '-google-sdk' || '' }}
  cancel-in-progress: true
jobs:
  plugin:
    if: ${{ !inputs.google_sdk_only && !inputs.cc_switch_desktop_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin: [pi-lmm-provider, dsh-lmm-provider, codewhale-lmm-provider, opencode-lmm-auth]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate the exact pinned plugin source
        working-directory: packages/${{ matrix.plugin }}
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          if test -f package-lock.json; then npm ci --ignore-scripts; fi
          case "$PLUGIN" in
            pi-lmm-provider)
              npm run typecheck
              npm test
              npm run pack:check
              npm run test:pi
              ;;
            dsh-lmm-provider)
              # DSH host contract: pin the supported pnpm major and suppress lifecycle hooks.
              npm install --global --ignore-scripts --no-package-lock --no-audit --no-fund pnpm@11.28.8
              npm run typecheck
              npm test
              npm run pack:check
              npm run test:host
              archive=$(npm pack --ignore-scripts --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(JSON.parse(s)[0].filename))')
              LMM_DSH_PLUGIN="$PWD/$archive" npm run test:host
              ;;
            codewhale-lmm-provider)
              npm run check
              npm test
              npm run pack:check
              npm install --prefix "$RUNNER_TEMP/codewhale-host" --ignore-scripts --no-package-lock --no-audit --no-fund codewhale@0.10.0
              LMM_CODEWHALE_BIN=$(HOST_ROOT="$RUNNER_TEMP/codewhale-host/node_modules/codewhale" node --input-type=commonjs -e 'require(process.env.HOST_ROOT + "/scripts/install.js").getBinaryPath("codewhale").then(p=>console.log(p)).catch(e=>{console.error(e);process.exitCode=1})')
              export LMM_CODEWHALE_BIN
              test -x "$LMM_CODEWHALE_BIN"
              npm run test:host
              ;;
            opencode-lmm-auth)
              npm run build
              git diff --exit-code -- dist
              npm run typecheck
              npm test
              npm run pack:check
              npm install --prefix "$RUNNER_TEMP/opencode-host" --ignore-scripts --no-package-lock --no-audit --no-fund opencode-ai@1.18.34
              # Keep npm lifecycle hooks disabled; run only this pinned package
              # setup script so its platform binary is installed for the host test.
              node "$RUNNER_TEMP/opencode-host/node_modules/opencode-ai/postinstall.mjs"
              export OPENCODE_BIN="$RUNNER_TEMP/opencode-host/node_modules/opencode-ai/bin/opencode.exe"
              npm run test:host
              npm run test:integration
              ;;
          esac
  pi-core-wallet:
    if: ${{ !inputs.google_sdk_only && !inputs.cc_switch_desktop_only }}
    name: Real Pi host and Core OAuth wallet
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the pinned real Pi package and isolated runner prerequisites
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- packages/pi-lmm-provider
          npm --prefix packages/pi-lmm-provider ci --ignore-scripts --no-audit --no-fund
          test -x packages/pi-lmm-provider/node_modules/.bin/pi
          packages/pi-lmm-provider/node_modules/.bin/pi --version
          rustup toolchain install 1.100.0 --profile minimal
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler
          printf '127.0.0.1 pi-issuer.example.test\n' | sudo tee -a /etc/hosts >/dev/null
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
          umask 077
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj /CN=pi-issuer.example.test -addext 'subjectAltName=DNS:pi-issuer.example.test' \
            -keyout "$RUNNER_TEMP/pi-issuer.key" -out "$RUNNER_TEMP/pi-issuer.pem"
      - name: Reconcile one real Pi prompt with its Core capture
        working-directory: services/core
        env:
          PI_HOST_RECEIPT: ${{ runner.temp }}/pi-core-receipt.json
          PI_HOST_PACKAGE: ${{ github.workspace }}/packages/pi-lmm-provider
          PI_HOST_BIN: ${{ github.workspace }}/packages/pi-lmm-provider/node_modules/.bin/pi
          FIXTURE_TLS_CERT: ${{ runner.temp }}/pi-issuer.pem
          FIXTURE_TLS_KEY: ${{ runner.temp }}/pi-issuer.key
        run: |
          set -euo pipefail
          gate=real_pi_host_discovers_prompts_and_settles_one_oauth_request
          cargo test --locked --test oauth2_pi_author "$gate" -- --exact --ignored --nocapture | tee "$RUNNER_TEMP/pi-core-result"
          grep -Fqx "test $gate ... ok" "$RUNNER_TEMP/pi-core-result"
          test -s "$PI_HOST_RECEIPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pi-core-wallet-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pi-core-receipt.json
          if-no-files-found: error
          retention-days: 7
  google-genai-sdk:
    if: ${{ !inputs.cc_switch_desktop_only }}
    name: Google Gen AI SDK history and Core wallet
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the Core toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Verify curated chat history with Google's pinned JavaScript SDK
        working-directory: services/core
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/gemini-chat-sdk"
          mkdir -p "$sdk"
          npm pack --pack-destination "$sdk" --ignore-scripts --silent @google/genai@3.6.1
          archive="$sdk/google-genai-3.6.1.tgz"
          test "$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)" = 'DQIkZkl+VoZc+RUSaJ41vRuywjQDpP0t/oUf5/ddQhNW6JsPjVULW2EgHmuJ1mrr6ACtrmUdPlqtNXF1yfKySg=='
          npm install --prefix "$sdk" --ignore-scripts --no-audit --no-fund "$archive"
          export LMM_GOOGLE_CHAT_DRIVER="$sdk/gemini-chat.mjs"
          cp "$GITHUB_WORKSPACE/scripts/ci/gemini-chat.mjs" "$LMM_GOOGLE_CHAT_DRIVER"
          gate=portable_matrix::genuine_gemini_chat_keeps_history_after_core_settlement
          cargo +1.100.0 test --locked --test native_model_http "$gate" -- --exact --ignored --nocapture | tee "$RUNNER_TEMP/gemini-chat-result"
          grep -Fqx "test $gate ... ok" "$RUNNER_TEMP/gemini-chat-result"
      - name: Verify per-request captures across public HTTP protocols
        working-directory: services/core
        run: |
          set -euo pipefail
          gate=portable_matrix::public_four_by_four_text_json_and_sse
          cargo +1.100.0 test --locked --test native_model_http "$gate" -- --exact --show-output | tee "$RUNNER_TEMP/public-protocol-matrix"
          grep -Fqx "test $gate ... ok" "$RUNNER_TEMP/public-protocol-matrix"
  cc-switch-cli:
    if: ${{ !inputs.google_sdk_only || inputs.cc_switch_desktop_only }}
    name: LMM CLI and native CC Switch configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Exercise managed-install plan and native SQLite inspection
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- apps/cli
          cd apps/cli
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 build --locked --bin lmm
          target/debug/lmm install cc-switch --dry-run --json > "$RUNNER_TEMP/cc-switch-plan.json"
          test -s "$RUNNER_TEMP/cc-switch-plan.json"
          cargo +1.100.0 test --locked --test cc_switch -- --nocapture | tee "$RUNNER_TEMP/cc-switch-tests"
          grep -Fqx 'test schema_24_inspection_distinguishes_database_selection_from_live_application_and_never_emits_keys ... ok' "$RUNNER_TEMP/cc-switch-tests"
          for gate in \
            cc_switch::bindings::tests::add_is_readonly_until_confirmed_and_commits_an_exact_recoverable_receipt_without_activation \
            cc_switch::bindings::tests::sync_keeps_user_names_extra_fields_native_model_choice_and_other_provider_selection \
            cc_switch::bindings::tests::restore_sync_merges_by_model_identity_preserving_following_user_edits \
            oauth::applications::tests::codex_pipe_emits_only_the_confirmed_live_token_and_never_a_replaced_grant; do
            cargo +1.100.0 test --locked --lib "$gate" -- --exact | tee "$RUNNER_TEMP/cc-switch-binding-test"
            grep -Fqx "test $gate ... ok" "$RUNNER_TEMP/cc-switch-binding-test"
          done
      - name: Install the reviewed CC Switch desktop and native accessibility tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth at-spi2-core dbus-x11 python3-pyatspi libwebkit2gtk-4.1-0 libayatana-appindicator3-1 imagemagick
          mkdir "$RUNNER_TEMP/official-cc-switch"
          cd "$RUNNER_TEMP/official-cc-switch"
          curl --fail --silent --show-error --location --proto '=https' --retry 2 --max-time 180 \
            https://github.com/farion1231/cc-switch/releases/download/v4.0.22/CC-Switch-v4.0.22-Linux-x86_64.AppImage -o cc-switch.AppImage
          test "$(stat -c %s cc-switch.AppImage)" = 97339896
          echo '9090a1bc5f58ccbc72444302c1a3d8001dd1b00fbff7b0d6b64bd1be58077313  cc-switch.AppImage' | sha256sum -c -
          chmod 755 cc-switch.AppImage
          ./cc-switch.AppImage --appimage-extract > /dev/null
      - name: Read the inactive provider in the actual Linux desktop after reopening
        run: |
          set -euo pipefail
          lib_test=$(cd apps/cli && cargo +1.100.0 test --locked --lib --no-run --message-format=json |
            jq -rs '[.[] | select(.reason == "compiler-artifact" and .profile.test and .target.kind == ["lib"] and .executable != null) | .executable] | if length == 1 then .[0] else error("expected one LMM library test binary") end')
          private_home=$(mktemp -d "$RUNNER_TEMP/cc-switch-home.XXXXXXXX")
          install -dm700 "$private_home/runtime"
          sudo unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --init-groups env HOME="$3" XDG_RUNTIME_DIR="$3/runtime" RUNNER_TEMP="$4" \
              dbus-run-session -- xvfb-run -a -s "-screen 0 1440x960x24" /usr/bin/python3 "$5" "$6" "$7" "$8"
          ' _ "$(id -u)" "$(id -g)" "$private_home" "$RUNNER_TEMP" "$PWD/scripts/ci/cc-switch-desktop.py" \
            "$RUNNER_TEMP/official-cc-switch/squashfs-root/AppRun" "$PWD/apps/cli/target/debug/lmm" "$lib_test"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cc-switch-desktop-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cc-switch-desktop-output/
          if-no-files-found: error
          retention-days: 7
  native-cli-wallet:
    if: ${{ !inputs.google_sdk_only && !inputs.cc_switch_desktop_only }}
    name: Native ${{ matrix.client }} CLI and Core wallet
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: codex
            package: '@openai/codex'
            version: '0.166.0'
            gate: real_cli::codex_exec_settles_one_native_responses_request
          - client: claude
            package: '@anthropic-ai/claude-code'
            version: '2.1.79'
            gate: real_cli::claude_print_settles_one_native_messages_request
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the reviewed stock executable and Core toolchain
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          PACKAGE_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/native-cli" --ignore-scripts --no-audit --no-fund "$PACKAGE_NAME@$PACKAGE_VERSION"
          rustup toolchain install 1.100.0 --profile minimal
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler
      - name: Require one terminal result and its PostgreSQL capture
        working-directory: services/core
        env:
          NATIVE_CLI_BIN: ${{ runner.temp }}/native-cli/node_modules/.bin/${{ matrix.client }}
          NATIVE_CLI_VERSION: ${{ matrix.version }}
          NATIVE_CLI_RECEIPT: ${{ runner.temp }}/native-cli-receipt.json
          GATE: ${{ matrix.gate }}
        run: |
          set -euo pipefail
          test -x "$NATIVE_CLI_BIN"
          cargo test --locked --test native_model_http "$GATE" -- --exact --ignored --nocapture | tee "$RUNNER_TEMP/native-cli-result"
          grep -Fqx "test $GATE ... ok" "$RUNNER_TEMP/native-cli-result"
          test -s "$NATIVE_CLI_RECEIPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.client }}-wallet-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-cli-receipt.json
          if-no-files-found: error
          retention-days: 7
  installer:
    if: ${{ !inputs.google_sdk_only && !inputs.cc_switch_desktop_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Check installer contracts
        working-directory: packages/lmm-scripts
        run: |
          set -euo pipefail
          for script in *.sh; do bash -n "$script"; done
          node --test test-codewhale.mjs test-opencode.mjs test-opencode-entry.mjs
  magpie:
    if: ${{ !inputs.google_sdk_only && !inputs.cc_switch_desktop_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: yetone/magpie
          ref: 7da5b34aa497858bef9b6823a72d499ab375e055 # upstream v0.1.2512
          path: .magpie-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare the genuine pinned headless host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .magpie-source rev-parse HEAD)" = 7da5b34aa497858bef9b6823a72d499ab375e055
          (cd .magpie-source && GOTOOLCHAIN=go1.26.8 make cli VERSION=0.1.2512)
          test "$(.magpie-source/magpie --version)" = 'magpie 0.1.2512'
          sha256sum .magpie-source/magpie
          curl --fail --silent --show-error --location --proto '=https' --max-time 120 --retry 2 \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64-baseline.zip -o "$RUNNER_TEMP/bun.zip"
          echo "c678040f14fe0440eb839d37cbd0ce4c051a32da72806ac97de6a6aab6bf728f  $RUNNER_TEMP/bun.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/magpie-runtime"
          runtime="$RUNNER_TEMP/magpie-runtime/bun-linux-x64-baseline/bun"
          test "$("$runtime" --version)" = 1.4.2
          echo "MAGPIE_BIN=$PWD/.magpie-source/magpie" >> "$GITHUB_ENV"
          echo "MAGPIE_BUN=$runtime" >> "$GITHUB_ENV"
      - name: Check the pinned plugin in the signed-out host
        working-directory: packages/opencode-lmm-auth
        env:
          DO_NOT_TRACK: '1'
          MAGPIE_NO_ACCOUNTS: '1'
        run: npm run test:magpie
      - name: Exercise real Magpie JSON and SSE against an ordinary Core account
        working-directory: services/core
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          set -euo pipefail
          umask 077
          export FIXTURE_TLS_KEY="$RUNNER_TEMP/magpie-fixture.key"
          export FIXTURE_TLS_CERT="$RUNNER_TEMP/magpie-fixture.crt" NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/magpie-fixture.crt"
          trap 'rm -f -- "$FIXTURE_TLS_KEY" "$FIXTURE_TLS_CERT"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=pi-issuer.example.test' \
            -addext 'subjectAltName=DNS:pi-issuer.example.test' -keyout "$FIXTURE_TLS_KEY" -out "$FIXTURE_TLS_CERT" 2>/dev/null
          echo '127.0.0.1 pi-issuer.example.test' | sudo tee -a /etc/hosts >/dev/null
          sudo sysctl -q -w net.ipv4.ip_unprivileged_port_start=443
          sudo --preserve-env=GITHUB_ACTIONS python3 ../../scripts/prepare-ci-apt.py
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler
          rustup toolchain install 1.100.0 --profile minimal
          name=real_magpie_gateway_ordinary_account_settles_json_and_sse
          log="$RUNNER_TEMP/magpie-core-acceptance.log"
          cargo +1.100.0 test --locked --test oauth2_magpie_budget "$name" -- --ignored --exact --nocapture --color=never 2>&1 | tee "$log"
          grep -Fx -- "test $name ... ok" "$log"
          grep -Fx -- "magpie_gateway_budget source=fixture cap_credits=900 consumed_credits=98 reserved_credits=0 external_paid_calls=0" "$log"
