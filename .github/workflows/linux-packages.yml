name: Diagnose Extore musl arm64 linkage
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: extore-musl-arm64-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      SOURCE_REVISION: 586f7afe3ed0371cbd9773c383c86282e9731f4f
      EXTORE_REVISION: cf3469dbe827afcfb2e3f054a63f7b9b7c40bc2b
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 586f7afe3ed0371cbd9773c383c86282e9731f4f
          persist-credentials: false
      - name: Freeze the original source inputs
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git submodule update --init --depth 1 -- packages/extore
          test "$(git -C packages/extore rev-parse HEAD)" = "$EXTORE_REVISION"
          python3 -B scripts/check-extore-plugin-pin.py
          command -v readelf
          mkdir -p out/evidence
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          def git(*args, cwd=root):
              return subprocess.check_output(['git', *args], cwd=cwd)
          paths = git('ls-files', '-z', '--', '.dockerignore',
                      'deployment/docker/extensions.Dockerfile',
                      'packaging/extore-plugin.json', 'services/extensions').decode().split('\0')
          extore = root / 'packages/extore'
          paths += ['packages/extore/' + name for name in
                    git('ls-files', '-z', '--', 'plugins/commerce', 'LICENSE', cwd=extore).decode().split('\0') if name]
          files = {name: hashlib.sha256((root / name).read_bytes()).hexdigest()
                   for name in sorted(set(paths)) if name}
          manifest = (json.dumps(files, sort_keys=True, indent=2) + '\n').encode()
          (root / 'out/evidence/source-inputs.json').write_bytes(manifest)
          receipt = {
              'diagnostic_only': True,
              'source_revision': git('rev-parse', 'HEAD').decode().strip(),
              'source_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
              'workflow_revision': os.environ['GITHUB_SHA'],
              'workflow_ref': os.environ['GITHUB_REF'],
              'workflow_run': os.environ['GITHUB_RUN_ID'],
              'extore_revision': git('rev-parse', 'HEAD', cwd=extore).decode().strip(),
              'extore_plugin_tree': git('rev-parse', 'HEAD:plugins/commerce', cwd=extore).decode().strip(),
              'source_inputs_sha256': hashlib.sha256(manifest).hexdigest(),
              'platform': 'linux/arm64',
              'target': 'binaries-musl',
              'source_archive_sha256': hashlib.sha256(git('archive', 'HEAD', '.dockerignore',
                  'deployment/docker/extensions.Dockerfile', 'packaging/extore-plugin.json',
                  'services/extensions')).hexdigest(),
              'extore_source_archive_sha256': hashlib.sha256(git('archive', 'HEAD',
                  'plugins/commerce', 'LICENSE', cwd=extore)).hexdigest(),
          }
          (root / 'out/evidence/source-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Build only the original arm64 Extensions musl export
        run: |
          docker buildx build --progress plain --platform linux/arm64 \
            -f deployment/docker/extensions.Dockerfile --target binaries-musl \
            --metadata-file out/evidence/buildx-metadata.json \
            --output type=local,dest=out/diagnostic . 2>&1 | tee out/evidence/build.log
      - name: Preserve actual ELF metadata and run the unchanged guard
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location('linux_package', root / 'packaging/linux/build.py')
          package = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(package)
          exports = root / 'out/diagnostic'
          evidence = root / 'out/evidence'
          manifest = {
              'diagnostic_only': True, 'source_revision': os.environ['SOURCE_REVISION'],
              'workflow_revision': os.environ['GITHUB_SHA'],
              'extore_revision': os.environ['EXTORE_REVISION'],
              'platform': 'linux-musl-arm64', 'files': {},
          }
          for path in sorted(exports.rglob('*')):
              if path.is_file():
                  data = path.read_bytes()
                  manifest['files'][str(path.relative_to(exports))] = {
                      'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data),
                  }
          (evidence / 'MANIFEST.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          results = []
          for relative, shared in [
              ('lmm-extensions', False),
              ('lib/extore/libextore_plugin_host.so', True),
              ('lib/extore/libextore_commerce_plugin.so', True),
          ]:
              path = exports / relative
              metadata = subprocess.run([
                  'readelf', '--wide', '--file-header', '--program-headers', '--section-headers',
                  '--dynamic', '--dyn-syms', '--version-info', str(path),
              ], text=True, capture_output=True, check=True, env={**os.environ, 'LC_ALL': 'C'})
              (evidence / (path.name + '.readelf.txt')).write_text(metadata.stdout)
              item = {'path': relative, **manifest['files'][relative]}
              try:
                  item['elf'] = package.inspect_elf(path, 'arm64', shared=shared, libc='musl',
                                                    allow_unversioned=not shared)
                  item['guard'] = 'pass'
              except ValueError as error:
                  item['guard'] = 'fail'
                  item['error'] = str(error)
              results.append(item)
              print(json.dumps(item))
          (evidence / 'guard-results.json').write_text(json.dumps(results, indent=2) + '\n')
          sys.exit(any(item['guard'] != 'pass' for item in results))
          PY
      - name: Upload diagnostic bytes and receipts without publishing a package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostic-extore-musl-arm64-586f7afe-${{ github.run_id }}
          path: |
            out/diagnostic/
            out/evidence/
          if-no-files-found: error
          retention-days: 7
