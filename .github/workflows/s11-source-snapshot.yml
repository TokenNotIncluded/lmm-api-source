name: S11 source snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'TokenNotIncluded/lmm-api-source' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize the pinned CLI for a self-contained bundle
        run: git submodule update --init -- apps/cli
      - name: Freeze current source and its pinned CLI without changing remote refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cli_revision=$(git rev-parse HEAD:apps/cli)
          test "$(git -C apps/cli rev-parse HEAD)" = "$cli_revision"
          mkdir -p "$RUNNER_TEMP/s11-sources"
          git bundle create "$RUNNER_TEMP/s11-sources/source.bundle" HEAD
          git -C apps/cli bundle create "$RUNNER_TEMP/s11-sources/cli.bundle" HEAD
          printf '%s %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/s11-sources/refs.txt"
          printf '%s %s\n' "$(git config -f .gitmodules submodule.apps/cli.url)" "$cli_revision" \
            >> "$RUNNER_TEMP/s11-sources/refs.txt"
          cd "$RUNNER_TEMP/s11-sources"
          sha256sum source.bundle cli.bundle refs.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s11-sources-${{ github.sha }}
          path: ${{ runner.temp }}/s11-sources/
          retention-days: 2
          if-no-files-found: error
