name: Relay regression tests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay-regressions-${{ github.sha }}
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: services/core
        shell: bash
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build the Core library test executable
        id: build_relay
        run: |
          cargo test --locked --lib --no-run --message-format=json-render-diagnostics |
            jq -er 'select(.reason == "compiler-artifact" and .profile.test and .executable != null and (.target.kind | index("lib"))) | .executable' > "$RUNNER_TEMP/relay-test-bin"
          test "$(wc -l < "$RUNNER_TEMP/relay-test-bin")" -eq 1
      - name: Verify OAuth catalogue against executable text routes
        run: |
          binary="$(cat "$RUNNER_TEMP/relay-test-bin")"
          "$binary" --test-threads=1 model_http::catalog::tests:: | tee "$RUNNER_TEMP/relay-catalog.log"
          grep -Fx 'test model_http::catalog::tests::oauth_catalog_admits_portable_text_across_all_eligible_supplier_targets ... ok' "$RUNNER_TEMP/relay-catalog.log"
      - name: Check protocol ordering, streaming delivery, cache affinity and failover
        if: ${{ !cancelled() && steps.build_relay.outcome == 'success' }}
        run: |
          binary="$(cat "$RUNNER_TEMP/relay-test-bin")"
          "$binary" --list > "$RUNNER_TEMP/relay-test-list"
          LMM_WS_ARTIFACTS="$(mktemp -d "$RUNNER_TEMP/relay-ws-XXXXXXXX")"
          export LMM_WS_ARTIFACTS
          cases=(
            native_anthropic_output_effort_keeps_its_wire_value_and_output_limit
            native_anthropic_preserves_deferred_tool_loading
            messages_consumes_sdk_markers_and_classifies_only_protocol_differences
            observed_output_limit_violation_is_scoped_and_rechecks_pinned_plans
            output_limit_contract_only_blocks_the_exact_anthropic_destination
            verified_anthropic_output_limit_violation_blocks_future_dispatch_only_for_that_model
            native_anthropic_output_effort_rejects_lossy_protocol_conversion
            complete_input_message_ids_follow_their_own_roles_and_order_only_on_responses
            responses_input_id_requires_a_complete_message_and_never_resolves_references
            pure_provider_errors_remain_eligible_for_configured_failover
            ambiguous_errors_never_authorize_redispatch
            route_dispatch_retry_pg_first_rollback_sends_once
            route_dispatch_retry_pg_two_rollbacks_send_once
            route_dispatch_retry_pg_exhaustion_never_sends
            native_models_pg_anthropic_header_dispatch_preserves_openai_and_checks_protocol
            gemini_long_decode_keeps_continuation_token_and_maps_finish_reasons
            route_failover_pg_safe_failures_keep_one_frozen_bill
            route_failover_pg_unknown_and_partial_tool_results_never_replay
            ws06_official_exact_rejects_before_handshake_and_unknown_usage_holds
            ws_reported_tier_difference_settles_once_at_the_frozen_price
            gemini_complete_response_preserves_signed_parts_on_both_sides_of_a_tool
            gemini_stream_separates_signed_parts_and_resumes_the_last_text_across_frames
            responses_metadata_keeps_terminal_usage
            anthropic_stream_accepts_inactive_stop_details_and_reports_usage
            compact_pg_sse_tools_stream_live_and_terminal_waits_for_real_settlement
            audio_stream_pg_checkpoints_before_delivery_then_settles_once
            key_pool_affinity_honors_health_and_preserves_the_round_robin_cursor
            prompt_cache_affinity_pg_keeps_a_warm_upstream_credential
          )
          for name in "${cases[@]}"; do
            grep -Fq "::${name}: test" "$RUNNER_TEMP/relay-test-list" || { echo "::error::Missing test $name"; exit 1; }
          done
          "$binary" --test-threads=1 --nocapture "${cases[@]}"
