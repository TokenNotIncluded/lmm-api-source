name: Microservice preview distributions
on:
  workflow_dispatch:
    inputs:
      installed_base:
        description: Verified installed source SHA for Web-only scope detection
        default: ''
        type: string
      version:
        description: Preview archive version, not a release tag
        default: 0.1.0-preview
        required: true
        type: string
  workflow_call:
    inputs:
      installed_base:
        description: Verified installed source SHA for Web-only scope detection
        default: ''
        type: string
      version:
        default: 0.1.0-preview
        type: string
      source_ref:
        description: Exact source commit for isolated review
        default: ''
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      components: ${{ steps.source.outputs.components }}
      source_revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Freeze the source used by all build jobs
        id: source
        env:
          INSTALLED_BASE: ${{ inputs.installed_base }}
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          components='["core","extensions","cli","web"]'
          if python3 scripts/is-web-only-update.py --base "$INSTALLED_BASE" --revision "$(git rev-parse HEAD)"; then
            components='["web"]'
          fi
          echo "components=$components" >> "$GITHUB_OUTPUT"
      - name: Initialize the pinned CLI only
        if: steps.source.outputs.components != '["web"]'
        run: git submodule update --init --depth 1 -- apps/cli
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        if: steps.source.outputs.components != '["web"]'
        with:
          go-version: '1.27.2'
          cache-dependency-path: services/extensions/go.sum
      - name: Source, documents and archive contracts
        if: steps.source.outputs.components != '["web"]'
        run: |
          python3 -B scripts/check-docs-brand.py
          python3 -B scripts/test_docs_brand.py
          python3 -B scripts/test-distribution.py
          python3 -B scripts/test-docs-microservices.py
          python3 -B scripts/test-core-boundaries.py
          node --test scripts/workflow-topology.test.mjs
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Check distribution and deployment scope contracts
        run: |
          python3 -B scripts/test-core-ci-material.py
          python3 -B scripts/test-deployment-plan.py
      - name: Go policy and host checks
        if: steps.source.outputs.components != '["web"]'
        working-directory: services/extensions
        run: |
          bash ../../scripts/check-go-format.sh .
          go vet ./internal/legal ./internal/app
          go test -mod=readonly -race -count=1 -v ./internal/legal ./internal/app ./internal/modules
  build:
    permissions:
      actions: read
      contents: read
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.contracts.outputs.components) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.component == 'core' && 90 || 30 }}
    env:
      COMPONENT: ${{ matrix.component }}
      PACKAGE_VERSION: ${{ inputs.version }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.contracts.outputs.source_revision }}
          persist-credentials: false
      - name: Initialize the pinned CLI only
        if: matrix.component == 'cli'
        run: git submodule update --init --depth 1 -- apps/cli
      - name: Initialize the pinned Extore plugin dependency
        if: matrix.component == 'extensions'
        run: |
          git submodule update --init --depth 1 -- packages/extore
          python3 -B scripts/check-extore-plugin-pin.py
      - name: Record actual source identity
        run: |
          echo "SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Require OpenRouter streaming and wallet receipts for the Core archive
        if: matrix.component == 'core'
        working-directory: services/core
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_TARGET_DIR: ${{ runner.temp }}/openrouter-wallet-target
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal
          sudo --preserve-env=GITHUB_ACTIONS python3 ../../scripts/prepare-ci-apt.py
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler

          db=$(docker run --detach --rm --publish 127.0.0.1::5432 \
            --env POSTGRES_PASSWORD=postgres \
            postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873)
          trap 'docker rm --force "$db" >/dev/null; rm -rf -- "$CARGO_TARGET_DIR"' EXIT
          for _ in {1..60}; do
            if docker exec "$db" pg_isready -h 127.0.0.1 -U postgres -q; then break; fi
            sleep 1
          done
          docker exec "$db" pg_isready -h 127.0.0.1 -U postgres -q
          address=$(docker port "$db" 5432/tcp)
          export DATABASE_URL="postgres://postgres:postgres@$address/postgres"

          require_test() {
            local name=$1
            shift
            local log="$RUNNER_TEMP/openrouter-wallet-$name.log"
            cargo +1.100.0 test --locked "$@" "$name" -- --exact --format=pretty --color=never 2>&1 | tee "$log"
            grep -Fx -- "test $name ... ok" "$log"
          }

          for name in \
            relay::tests::anthropic_thinking_usage_preserves_the_terminal_receipt \
            relay::tests::opaque_reasoning_does_not_interrupt_responses_usage \
            relay::native_anthropic::tests::native_anthropic_preserves_eager_tool_streaming \
            relay::native_anthropic::tests::native_anthropic_keeps_inline_system_messages_at_their_original_position \
            relay::native_anthropic::tests::native_anthropic_preserves_thinking_and_context_controls \
            relay::openrouter_tests::openrouter_stream_images_arrive_before_finish_and_keep_usage_only_tail \
            relay::openrouter_tests::openrouter_repeated_finish_carries_authoritative_usage_once \
            relay::openrouter_tests::openrouter_tool_stream_rejects_malformed_arguments_usage_and_conflicting_finish \
            relay::openrouter_tests::openrouter_image_content_after_finish_is_not_silently_accepted \
            model_http::selected_bound_tests::openrouter_stream_usage_tail_settles_once_through_chat_gateway \
            model_http::selected_bound_tests::openrouter_fragmented_tool_and_repeated_finish_capture_once \
            model_http::selected_bound_tests::prepared_financial_tests::prepared_contract_tier_cache_maximum_and_reasoning_use_frozen_terms \
            routing::tiered::tests::openai_v4_frozen_tariff_restores_exact_price_and_rejects_anthropic_or_new_mode \
            routing::tiered::tests::frozen_tariff_keeps_exact_rates_and_rejects_unknown_fields; do
            require_test "$name" --lib
          done
          require_test relay::tests::anthropic_stream_start_forwards_observed_usage --lib
          require_test relay::tests::complete_native_terminal_usage_can_correct_the_provisional_input --lib
          require_test relay::encode::writer_contract_tests::gemini_projects_visible_text_without_private_thinking_or_signature --lib
          require_test routing::tests::route_edit_order_is_canonical_after_recovery --lib
          require_test portable_matrix::public_four_by_four_text_json_and_sse --test native_model_http
          require_test portable_matrix::unsupported_gemini_operations_fields_and_grounding_do_not_dispatch --test native_model_http
          require_test model_http::selected_bound_tests::openrouter_converts_portable_native_requests_and_settles_once --lib
          require_test malformed_tool_json_with_usage_and_done_remains_frozen --test model_http
      - name: Reuse the qualified Core for this exact source and compiler
        id: qualified
        if: matrix.component == 'core'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          material="$RUNNER_TEMP/qualified-core"
          python3 -B scripts/fetch-core-ci-material.py "$material"
          if [[ -d "$material" ]]; then
            python3 -B scripts/core-ci-material.py verify "$material"
            mkdir -p out/core
            cp "$material/lmm-core" out/core/lmm-core
            echo "reused=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build core or extension binaries using their Docker compiler stage
        if: (matrix.component == 'core' && steps.qualified.outputs.reused != 'true') || matrix.component == 'extensions'
        run: |
          docker buildx build -f "deployment/docker/${COMPONENT}.Dockerfile"             --target binaries --output "type=local,dest=out/${COMPONENT}" .
      - name: Build runtime image and inspect shipped resources
        if: (matrix.component == 'core' && steps.qualified.outputs.reused != 'true') || matrix.component == 'extensions'
        run: |
          docker buildx build -f "deployment/docker/${COMPONENT}.Dockerfile" --load -t "lmm-preview-${COMPONENT}" .
          docker run --rm --entrypoint /bin/sh "lmm-preview-${COMPONENT}" -ec '
            test -s /usr/share/licenses/lmm/LICENSE
            test -s /usr/share/licenses/lmm/NOTICE
            test -s /usr/share/licenses/lmm/THIRD-PARTY-LICENSES.md
          '
          if [[ "$COMPONENT" == extensions ]]; then
            docker run --rm --entrypoint /bin/sh lmm-preview-extensions -ec '
              test -s /usr/lib/lmm/extensions/extore/libextore_plugin_host.so
              test -s /usr/lib/lmm/extensions/extore/libextore_commerce_plugin.so
              test -s /usr/share/licenses/lmm-extensions/extore/LICENSE
              test -s /usr/share/licenses/lmm-extensions/extore/THIRD-PARTY-NATIVE.txt
              test -s /usr/share/licenses/lmm-extensions/extore/THIRD-PARTY-NATIVE.json
              test -s /usr/share/licenses/lmm-extensions/purego/LICENSE
              test -s /usr/share/licenses/lmm-extensions/purego/GO-LICENSE
              test -s /usr/share/lmm/legal/site.example.toml
              test ! -e /usr/share/lmm/legal/sites
              test ! -e /usr/share/lmm/legal/site.json
              test ! -e /usr/share/lmm/legal/site.toml
              test ! -e /usr/share/lmm/legal/site.example.json
            '
            (cd config/legal && sha256sum site.example.toml templates/*/*.md) |
              docker run --rm -i --workdir /usr/share/lmm/legal --entrypoint sha256sum lmm-preview-extensions -c -
          fi
      - name: Actual extension policy process checks
        if: matrix.component == 'extensions'
        run: LMM_EXTENSION_TEST_BIN="$PWD/out/extensions/lmm-extensions" python3 -B scripts/test-legal-process.py
      - name: Install CLI toolchain
        if: matrix.component == 'cli'
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          sudo --preserve-env=GITHUB_ACTIONS python3 scripts/prepare-ci-apt.py
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - name: Build and test CLI
        if: matrix.component == 'cli'
        run: |
          cargo +1.100.0 test --manifest-path apps/cli/Cargo.toml --locked --all-targets
          cargo +1.100.0 build --manifest-path apps/cli/Cargo.toml --locked --release
          mkdir -p out/cli
          cp apps/cli/target/release/lmm out/cli/
      - name: Install Bun
        if: matrix.component == 'web'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Build and inspect frontend
        if: matrix.component == 'web'
        env:
          VITE_REACT_APP_VERSION: ${{ inputs.version }}
        run: |
          bun install --frozen-lockfile
          (cd apps/web && bun test --preload ./scripts/test-preload.mjs ./src/components/ai-elements/openui/library.test.tsx)
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check
          mkdir -p out/web
          cp -a apps/web/dist/. out/web/
      - name: Build and inspect an independent preview archive
        run: |
          platform=linux-amd64
          if [[ "$COMPONENT" == web ]]; then platform=any; fi
          python3 scripts/build-distribution.py build --component "$COMPONENT"             --version "$PACKAGE_VERSION" --revision "$SOURCE_REVISION"             --platform "$platform" --input "out/$COMPONENT"
          for archive in out/distributions/*.tar.gz; do
            python3 scripts/build-distribution.py verify "$archive" --revision "$SOURCE_REVISION"
          done
          (cd out/distributions && sha256sum --check ./*.sha256)
      - name: Preserve the qualified build evidence with the Core archive
        if: steps.qualified.outputs.reused == 'true'
        run: |
          mkdir out/distributions/core-build-evidence
          cp "$RUNNER_TEMP/qualified-core/"{build.json,schema.json,sbom.spdx.json} out/distributions/core-build-evidence/
      - name: Preserve preview archives only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lmm-preview-${{ matrix.component }}-${{ env.SOURCE_REVISION }}
          path: out/distributions/*
          if-no-files-found: error
          retention-days: 7
