name: Microservice preview distributions
on:
  workflow_dispatch:
    inputs:
      extore_plugin:
        description: Include the optional GNU Extore host/library pair; does not enable it
        default: false
        type: boolean
      version:
        description: Preview archive version, not a release tag
        default: 0.1.0-preview
        required: true
        type: string
  workflow_call:
    inputs:
      extore_plugin:
        description: Include the optional GNU Extore host/library pair; does not enable it
        default: false
        type: boolean
      version:
        default: 0.1.0-preview
        type: string
      source_ref:
        description: Exact source commit for isolated review
        default: ''
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Freeze the source used by all build jobs
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Initialize the pinned CLI only
        run: git submodule update --init --depth 1 -- apps/cli
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version: '1.27.2'
          cache-dependency-path: services/extensions/go.sum
      - name: Source, documents and archive contracts
        run: |
          python3 -B scripts/check-docs-brand.py
          python3 -B scripts/test_docs_brand.py
          python3 -B scripts/test-distribution.py
          python3 -B scripts/test-docs-microservices.py
          python3 -B scripts/test-core-boundaries.py
          node --test scripts/workflow-topology.test.mjs
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Go policy and host checks
        working-directory: services/extensions
        run: |
          bash ../../scripts/check-go-format.sh .
          go vet ./internal/legal ./internal/app
          go test -mod=readonly -race -count=1 -v ./internal/legal ./internal/app ./internal/modules
  build:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        component: [core, extensions, cli, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPONENT: ${{ matrix.component }}
      PACKAGE_VERSION: ${{ inputs.version }}
      CARGO_BUILD_JOBS: '2'
      INCLUDE_EXTORE_PLUGIN: ${{ inputs.extore_plugin && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.contracts.outputs.source_revision }}
          persist-credentials: false
      - name: Initialize the pinned CLI only
        if: matrix.component == 'cli'
        run: git submodule update --init --depth 1 -- apps/cli
      - name: Record actual source identity
        run: |
          echo "SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Bind the optional Extore bundle to the checked source gitlink
        if: matrix.component == 'extensions' && inputs.extore_plugin
        run: |
          git submodule update --init --depth 1 -- third_party/extore
          revision=$(git rev-parse HEAD:third_party/extore)
          test "$revision" = "$(git -C third_party/extore rev-parse HEAD)"
          test -z "$(git -C third_party/extore status --porcelain)"
          echo "EXTORE_REVISION=$revision" >> "$GITHUB_ENV"
      - name: Build core or extension binaries using their Docker compiler stage
        if: matrix.component == 'core' || matrix.component == 'extensions'
        run: |
          target=binaries
          build_args=()
          if [[ "$COMPONENT" == extensions && "$INCLUDE_EXTORE_PLUGIN" == true ]]; then
            target=binaries-extore
            build_args+=(--build-arg "LMM_SOURCE_REVISION=$SOURCE_REVISION"
                         --build-arg "EXTORE_SOURCE_REVISION=$EXTORE_REVISION")
          fi
          docker buildx build -f "deployment/docker/${COMPONENT}.Dockerfile" \
            --target "$target" "${build_args[@]}" --output "type=local,dest=out/${COMPONENT}" .
      - name: Build runtime image and inspect shipped resources
        if: matrix.component == 'core' || matrix.component == 'extensions'
        run: |
          target=runtime
          build_args=()
          if [[ "$COMPONENT" == extensions && "$INCLUDE_EXTORE_PLUGIN" == true ]]; then
            target=runtime-extore
            build_args+=(--build-arg "LMM_SOURCE_REVISION=$SOURCE_REVISION"
                         --build-arg "EXTORE_SOURCE_REVISION=$EXTORE_REVISION")
          fi
          docker buildx build -f "deployment/docker/${COMPONENT}.Dockerfile" --target "$target" \
            "${build_args[@]}" --load -t "lmm-preview-${COMPONENT}" .
          docker run --rm --entrypoint /bin/sh "lmm-preview-${COMPONENT}" -ec '
            test -s /usr/share/licenses/lmm/LICENSE
            test -s /usr/share/licenses/lmm/NOTICE
            test -s /usr/share/licenses/lmm/THIRD-PARTY-LICENSES.md
          '
          if [[ "$COMPONENT" == extensions ]]; then
            docker run --rm --entrypoint /bin/sh lmm-preview-extensions -ec '
              test -s /usr/share/lmm/legal/site.example.toml
              test "$(find /usr/share/lmm/legal/templates -name "*.md" | wc -l)" -eq 6
              test ! -e /usr/share/lmm/legal/site.json
              test ! -e /usr/share/lmm/legal/site.toml
              test ! -e /usr/share/lmm/legal/site.example.json
            '
          fi
      - name: Actual extension policy process checks
        if: matrix.component == 'extensions'
        run: LMM_EXTENSION_TEST_BIN="$PWD/out/extensions/lmm-extensions" python3 -B scripts/test-legal-process.py
      - name: Install CLI toolchain
        if: matrix.component == 'cli'
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          sudo --preserve-env=GITHUB_ACTIONS python3 scripts/prepare-ci-apt.py
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - name: Build and test CLI
        if: matrix.component == 'cli'
        run: |
          cargo +1.100.0 test --manifest-path apps/cli/Cargo.toml --locked --all-targets
          cargo +1.100.0 build --manifest-path apps/cli/Cargo.toml --locked --release
          mkdir -p out/cli
          cp apps/cli/target/release/lmm out/cli/
      - name: Install Bun
        if: matrix.component == 'web'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Build and inspect frontend
        if: matrix.component == 'web'
        env:
          VITE_REACT_APP_VERSION: ${{ inputs.version }}
        run: |
          bun install --frozen-lockfile
          (cd apps/web && bun test --preload ./scripts/test-preload.mjs ./src/components/ai-elements/openui/library.test.tsx)
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check
          mkdir -p out/web
          cp -a apps/web/dist/. out/web/
      - name: Build and inspect an independent preview archive
        run: |
          platform=linux-amd64
          if [[ "$COMPONENT" == web ]]; then platform=any; fi
          bundle_args=()
          if [[ "$COMPONENT" == extensions && "$INCLUDE_EXTORE_PLUGIN" == true ]]; then
            bundle_args+=(--extore-revision "$EXTORE_REVISION")
          fi
          python3 scripts/build-distribution.py build --component "$COMPONENT" \
            --version "$PACKAGE_VERSION" --revision "$SOURCE_REVISION" \
            --platform "$platform" --input "out/$COMPONENT" "${bundle_args[@]}"
          for archive in out/distributions/*.tar.gz; do
            python3 scripts/build-distribution.py verify "$archive" --revision "$SOURCE_REVISION"
          done
          (cd out/distributions && sha256sum --check ./*.sha256)
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        if: matrix.component == 'extensions' && inputs.extore_plugin
        with:
          version: 2026.11.10
          sha256: b603a4f48563fc379a794d9ea2cf9f709ed276c9141068604cb0c59fa3e674a9
          install_args: go
      - name: Exercise the actual archived GNU host and library
        if: matrix.component == 'extensions' && inputs.extore_plugin
        env:
          MISE_EXEC_AUTO_INSTALL: "false"
        run: |
          docker buildx build -f deployment/docker/extensions.Dockerfile --target extore-test-binaries \
            --build-arg "LMM_SOURCE_REVISION=$SOURCE_REVISION" --build-arg "EXTORE_SOURCE_REVISION=$EXTORE_REVISION" \
            --output type=local,dest=out/extore-fixture .
          archive="out/distributions/lmm-extensions-$PACKAGE_VERSION-linux-amd64-extore.tar.gz"
          python3 scripts/build-distribution.py verify "$archive" --revision "$SOURCE_REVISION"
          mkdir out/extore-archive
          tar -xzf "$archive" -C out/extore-archive
          python3 -B services/extensions/extore-host/tests/native-flow.py \
            --extore-source third_party/extore --extore-binary out/extore-fixture/extore \
            --host out/extore-archive/libexec/lmm-extore-host \
            --plugin out/extore-archive/lib/extore/libextore_zplugin.so --output out/extore-native
          grep -F -- '--- PASS: TestExtoreNativePlugin' out/extore-native/native-flow.log
          ! grep -F -- '--- SKIP: TestExtoreNativePlugin' out/extore-native/native-flow.log
      - name: Preserve optional archive native-flow evidence
        if: always() && matrix.component == 'extensions' && inputs.extore_plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extore-archive-evidence-${{ env.SOURCE_REVISION }}
          path: |
            out/extore-native/receipt.json
            out/extore-native/native-flow.log
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve preview archives only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lmm-preview-${{ matrix.component }}-${{ env.SOURCE_REVISION }}${{ matrix.component == 'extensions' && inputs.extore_plugin && '-extore' || '' }}
          path: out/distributions/*
          if-no-files-found: error
          retention-days: 7
