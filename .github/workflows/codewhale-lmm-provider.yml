name: Codewhale LMM provider
on:
  workflow_dispatch:
    inputs:
      core_wallet_only:
        description: Run the official CodeWhale host with the private Core OAuth and wallet fixture
        type: boolean
        default: false

permissions:
  contents: read
# Only retained client/frontend code is checked here. The old Go business
# implementation was removed; this does not qualify its future replacement.
jobs:
  adapter:
    if: ${{ !inputs.core_wallet_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false
      - name: Initialize adapter when extracted as a submodule
        run: |
          if git ls-files --stage packages/codewhale-lmm-provider | grep -q '^160000 '; then
            git submodule update --init --depth 1 -- packages/codewhale-lmm-provider
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run check && npm test && npm run pack:check
        working-directory: packages/codewhale-lmm-provider

  core-wallet:
    if: ${{ inputs.core_wallet_only }}
    name: Official CodeWhale through Core OAuth and wallet
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the official host, companion and Core prerequisites
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- packages/codewhale-lmm-provider
          host="$RUNNER_TEMP/codewhale-host"
          npm install --prefix "$host" --no-package-lock --no-audit --no-fund codewhale@0.10.0
          HOST_ROOT="$host/node_modules/codewhale" node --input-type=commonjs -e '
            require(process.env.HOST_ROOT + "/scripts/install.js").getBinaryPath("codewhale")
              .then(path => console.log("LMM_CODEWHALE_BIN=" + path))
              .catch(() => { process.exitCode = 1; })' >> "$GITHUB_ENV"
          rustup toolchain install 1.100.0 --profile minimal
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler
          printf '127.0.0.1 pi-issuer.example.test\n' | sudo tee -a /etc/hosts >/dev/null
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
          umask 077
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=pi-issuer.example.test \
            -addext 'subjectAltName=DNS:pi-issuer.example.test' -keyout "$RUNNER_TEMP/issuer.key" -out "$RUNNER_TEMP/issuer.pem"
      - name: Match official exec, ordinary OAuth and one PostgreSQL capture
        working-directory: services/core
        env:
          CODEWHALE_ADAPTER_CLI: ${{ github.workspace }}/packages/codewhale-lmm-provider/src/cli.mjs
          FIXTURE_TLS_KEY: ${{ runner.temp }}/issuer.key
          FIXTURE_TLS_CERT: ${{ runner.temp }}/issuer.pem
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/issuer.pem
          CODEWHALE_CORE_RECEIPT: ${{ runner.temp }}/codewhale-core-wallet.json
        run: |
          set -euo pipefail
          gate=codewhale::official_exec_settles_one_oauth_request
          cargo test --locked --test oauth2_provider_clients "$gate" -- --ignored --exact --nocapture | tee "$RUNNER_TEMP/codewhale-core.log"
          grep -Fqx "test $gate ... ok" "$RUNNER_TEMP/codewhale-core.log"
          test -s "$CODEWHALE_CORE_RECEIPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codewhale-core-wallet-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/codewhale-core-wallet.json
          if-no-files-found: error
          retention-days: 7
