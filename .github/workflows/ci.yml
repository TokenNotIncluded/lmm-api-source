name: CI
on:
  workflow_dispatch:
    inputs:
      base-ref:
        description: Git ref for the translation regression comparison
        default: HEAD^
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
jobs:
  scope:
    name: Classify deployable source changes
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web-only: ${{ steps.scope.outputs.web-only }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          WEB_BASE: ${{ vars.DEPLOY_WEB_BASE_REVISION }}
          DEPLOY_ENVIRONMENT_NAME: ${{ vars.DEPLOY_ENVIRONMENT || 'shadow' }}
          DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          web_only=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            WEB_BASE=$(python3 -B scripts/resolve-deployment-web-base.py)
            if python3 scripts/is-web-only-update.py --base "$WEB_BASE" --revision "$GITHUB_SHA"; then
              web_only=true
            fi
          fi
          echo "web-only=$web_only" >> "$GITHUB_OUTPUT"

  microkernel:
    needs: scope
    if: needs.scope.outputs.web-only != 'true'
    uses: ./.github/workflows/core-protocol.yml
    with:
      split_rust_targets: true
  web:
    name: Web checks and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run --filter @lmm/web format:check

      - name: Check copyright headers
        run: bun run --filter @lmm/web copyright:check

      - name: Lint and typecheck
        run: |
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck

      - name: Test web workspace
        env:
          LMM_WEB_TEST_JOBS: "4"
        run: bun run --filter @lmm/web test

      - name: Build production web assets
        env:
          VITE_REACT_APP_VERSION: ${{ github.sha }}
        run: |
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check

      - name: Preserve checked web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-${{ github.sha }}-${{ github.run_id }}
          path: apps/web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  translations:
    name: Translation regression check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source and comparison history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Use the PR merge ref so older branches receive the current checker.
          fetch-depth: 0
          persist-credentials: false

      - name: Test the translation checker
        run: node --test scripts/check-i18n.test.mjs

      - name: Check added keys and removed translations
        # The checker still runs on tags; only the branch comparison is inapplicable.
        if: github.ref_type != 'tag'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base-ref || 'HEAD^' }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            node scripts/check-i18n.mjs --base "$BASE_REF" --merge-base
          else
            node scripts/check-i18n.mjs --base "$BASE_REF"
          fi

  quality-gate:
    name: Implemented component checks
    if: ${{ always() }}
    needs: [scope, microkernel, web, translations]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every implemented component
        if: needs.scope.outputs.web-only != 'true'
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          KERNEL_RESULT: ${{ needs.microkernel.result }}
          WEB_RESULT: ${{ needs.web.result }}
          TRANSLATION_RESULT: ${{ needs.translations.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$KERNEL_RESULT" = success
          test "$WEB_RESULT" = success
          test "$TRANSLATION_RESULT" = success
          echo 'These checks do not authorize production deployment.'
      - name: Require Web-only checks
        if: needs.scope.outputs.web-only == 'true'
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          KERNEL_RESULT: ${{ needs.microkernel.result }}
          WEB_RESULT: ${{ needs.web.result }}
          TRANSLATION_RESULT: ${{ needs.translations.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$KERNEL_RESULT" = skipped
          test "$WEB_RESULT" = success
          test "$TRANSLATION_RESULT" = success
