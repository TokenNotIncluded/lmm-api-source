version=1
[server]
listen="127.0.0.1:{coreport}"
worker_threads=2
[database]
url_file={runtime}
max_connections=4
[console]
enabled=true
[identity.web]
origin="http://127.0.0.1:{coreport}"
refresh_key_file={refresh}
local_http=true
user_agreement_enabled=false
privacy_policy_enabled=false
[rpc]
socket={socket}
token_file={identity}
[model]
config_file={model}
local_http=true
