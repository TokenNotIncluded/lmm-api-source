# Native console vhost. The community extension serves both public rankings.
location = /api/rankings {
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    try_files /.__lmm_backend__ @lmm_extensions_backend;
}
location = /api/rankings/users {
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    try_files /.__lmm_backend__ @lmm_extensions_backend;
}
