# Include only in the reviewed native console vhost, beside the existing
# Extensions settings routes. Its ACL and @lmm_extensions_backend stay intact.
# Positive numeric IDs and HTTP methods are explicit; adjacent Core paths
# continue through the installation's existing route policy.

location = /api/option/waffo-pancake/config {
    if ($request_method != GET) { return 405; }
    try_files /.__lmm_backend__ @lmm_extensions_backend;
}

location = /api/option/epay/config {
    if ($request_method != GET) { return 405; }
    try_files /.__lmm_backend__ @lmm_extensions_backend;
}

location = /core/v1/admin/user-access {
    return 404;
}
location ^~ /core/v1/admin/user-access/ {
    if ($request_uri !~ "^/core/v1/admin/user-access/[1-9][0-9]*([?].*)?$") {
        return 404;
    }
    if ($request_method !~ "^(GET|PATCH)$") { return 405; }
    try_files /.__lmm_backend__ @lmm_native_management_core;
}

location = /core/v1/payment-gateways/epay {
    if ($request_method != GET) { return 405; }
    try_files /.__lmm_backend__ @lmm_native_management_core;
}
location ^~ /core/v1/payment-gateways/epay/ {
    if ($request_uri !~ "^/core/v1/payment-gateways/epay/[1-9][0-9]*([?].*)?$") {
        return 404;
    }
    if ($request_method != PUT) { return 405; }
    try_files /.__lmm_backend__ @lmm_native_management_core;
}

location @lmm_native_management_core {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-LMM-Canary "";
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_read_timeout 30s;
}
