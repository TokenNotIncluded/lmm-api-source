# Integrate only after checking the current server/location inventory.
# API/model/OAuth routes must keep their reviewed upstreams and URI semantics.
# Return before location selection so prefix/regex routes and the SPA cannot
# handle hidden deployment files. Match the normalized path, not its query.
if ($uri ~* "(?:^|/)(?:[.]git|[.]env(?:[._~-][^/]*)?)(?:/|$)") {
    return 404;
}

location / {
    root /opt/lmm/current/web/dist;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}
