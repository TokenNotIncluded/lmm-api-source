# Include at server scope in the native console vhost, beside its existing
# Core/Extensions routes. This is a closed browser surface, not an auth proxy.
# Validate the original URI as Nginx normalizes path segments before selection.
# Core alone authenticates cookies and checks the original operation and CSRF.

location = /api/user/auth/assistant/weekly-discounts {
    if ($request_uri !~ "^/api/user/auth/assistant/weekly-discounts([?].*)?$") {
        return 404;
    }
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    try_files /.__lmm_backend__ @lmm_native_assistant_browser_core;
}
location ^~ /api/user/auth/assistant/weekly-discounts/ {
    if ($request_uri !~ "^/api/user/auth/assistant/weekly-discounts/[0-9a-f]{64}$") {
        return 404;
    }
    if ($request_method !~ "^(GET|HEAD|POST)$") { return 405; }
    try_files /.__lmm_backend__ @lmm_native_assistant_browser_core;
}

location = /api/user/auth/assistant/confirmations {
    return 404;
}
location = /api/user/auth/assistant/confirmations/ui.js {
    if ($request_uri != "/api/user/auth/assistant/confirmations/ui.js") { return 404; }
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    try_files /.__lmm_backend__ @lmm_native_assistant_browser_core;
}
location ^~ /api/user/auth/assistant/confirmations/ {
    if ($request_uri !~ "^/api/user/auth/assistant/confirmations/[0-9a-f]{64}(/key)?$") {
        return 404;
    }
    if ($request_method !~ "^(GET|HEAD|POST)$") { return 405; }
    try_files /.__lmm_backend__ @lmm_native_assistant_browser_core;
}

# Old immutable receipts may contain this earlier prefix. Core returns a
# same-origin 307 to the current cookie-scoped path. Old writes stay disabled.
location = /api/user/assistant/confirmations {
    return 404;
}
location = /api/user/assistant/confirmations/ui.js {
    if ($request_uri != "/api/user/assistant/confirmations/ui.js") { return 404; }
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    try_files /.__lmm_backend__ @lmm_native_assistant_browser_core;
}
location ^~ /api/user/assistant/confirmations/ {
    if ($request_uri !~ "^/api/user/assistant/confirmations/[0-9a-f]{64}(/key)?$") {
        return 404;
    }
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    try_files /.__lmm_backend__ @lmm_native_assistant_browser_core;
}

location @lmm_native_assistant_browser_core {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-LMM-Canary "";
    # Preserve the browser's Origin and Cookie headers; never mint authority.
    proxy_next_upstream off;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 30s;
}
