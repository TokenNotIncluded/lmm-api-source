# Include only in the native Core server block.
location = /api/rss/settings {
    set $lmm_access_policy_original_uri $uri;
    if ($request_method = OPTIONS) { return 418; }
    if ($request_method !~ ^(GET|PUT)$) { return 405; }
    try_files /.__lmm_backend__ @lmm_extensions_backend;
}

location = /api/option/hero-sms/key {
    set $lmm_access_policy_original_uri $uri;
    if ($request_method = OPTIONS) { return 418; }
    if ($request_method != DELETE) { return 405; }
    try_files /.__lmm_backend__ @lmm_extensions_backend;
}

# Exact browser namespace for HumanGrant. The existing API and protocol routes
# already forward to Core and keep their authentication checks.
location ~ ^/humangrant(?:/(?:config|client\.js|ui\.js|style\.css))?$ {
    set $lmm_access_policy_original_uri $uri;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    try_files /.__lmm_backend__ @lmm_api_backend;
}

location ~ ^/human/[^/]+$ {
    set $lmm_access_policy_original_uri $uri;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    try_files /.__lmm_backend__ @lmm_api_backend;
}
