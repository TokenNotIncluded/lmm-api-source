---
- name: Compare the active slot with the selected artifact
  ansible.builtin.command:
    argv:
      - '{{ ansible_python_interpreter }}'
      - '{{ deploy_root }}/.tools/scripts/build-distribution.py'
      - verify-installed
      - '{{ component.previous }}'
      - --revision
      - '{{ deploy_revision }}'
    stdin: '{{ component.files | to_json }}'
  register: installed_artifact
  changed_when: false
  failed_when: false

- name: Check whether the selected component already serves traffic
  block:
    - name: Verify the installed component without waiting for startup
      ansible.builtin.include_tasks: verify.yml
      vars:
        readiness_retries: 0
    - name: Record that the running component already matches
      ansible.builtin.set_fact:
        component_already_running: true
  rescue:
    - name: Reinstall the component that failed its live check
      ansible.builtin.set_fact:
        component_already_running: false
  when: installed_artifact.rc | default(1) == 0

- name: Queue a slot change when the selected artifact is missing or unhealthy
  ansible.builtin.set_fact:
    deploy_states: '{{ deploy_states + [component] }}'
  when: installed_artifact.rc | default(1) != 0 or not component_already_running
